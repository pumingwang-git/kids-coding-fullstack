<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scratch 工作台</title>
    <style>
        /* 平台设计令牌：与 admin.css / styles.css 同源（纸白 / 薄荷绿 / 深绿）。
           Studio 是独立 webpack 应用，够不到主站样式表，所以在这里重述一份。
           改动时请与 `public/admin/admin.css` 的 :root 保持一致——课程操作栏与
           后台是同一套视觉，Scratch GUI 自己的紫色只属于它自己那一层。 */
        :root {
            --paper: #f8f8f0;
            --ink: #222b28;
            --accent: #2f806e;
            --mint: #dcebe1;
            --muted: #68716d;
            --line: rgba(34, 43, 40, 0.14);
            --danger: #b95c50;
            --warn: #bf8d39;
            --font-ui: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
        }
        html, body, #root {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        #root {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
</html>
