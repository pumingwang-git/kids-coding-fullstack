<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>班级管理 · 后台</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="admin-classes">
    <!--
  THESIS: 班级管理把范围事实放在列表第一位，拒绝把教师权限再复制成前端规则。
  OWN-WORLD: 纸白工作台、薄荷绿动作色、深绿文字与细线表格，详情是同一张工作台的延伸。
  STORY: 管理员扫描班级，教师只看到后端允许的班级，点击一行核对班级主数据。
  FIRST VIEWPORT: 标题与刷新动作在上，检索条和全宽列表紧随其后，详情从列表行进入。
  FORM: 既有后台运营表格的延伸，采用原生表格与窄详情栏，不引入新的卡片体系。
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="main">
        <header class="topbar" id="topbar"></header>
        <main class="content class-page">
          <div class="page-head">
            <div>
              <h1>班级管理</h1>
              <p>班级主数据与可见范围</p>
            </div>
            <div class="head-actions">
              <button class="btn primary" id="createClassBtn" type="button" hidden>新建班级</button>
              <button class="btn" id="exportClassRelationships" type="button">导出关系</button>
              <button class="btn" id="refreshClasses" type="button">刷新列表</button>
            </div>
          </div>

          <section class="card class-list-card" aria-labelledby="classListTitle">
            <div class="class-section-head">
              <div>
                <h2 id="classListTitle">班级列表</h2>
                <p class="muted" id="classListMeta">加载中…</p>
              </div>
              <label class="class-search">
                <span>筛选名称</span>
                <input
                  id="classSearch"
                  type="search"
                  placeholder="输入班级名称"
                  autocomplete="off"
                />
              </label>
            </div>
            <div class="table-wrap class-table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>班级</th>
                    <th>课包 ID</th>
                    <th>状态</th>
                    <th>开始时间</th>
                    <th>结束时间</th>
                    <th class="class-action-col">操作</th>
                  </tr>
                </thead>
                <tbody id="classRows"></tbody>
              </table>
            </div>
            <div class="empty" id="classEmpty" hidden>暂无可见班级</div>
            <div class="list-error" id="classError" hidden>
              <span id="classErrorText">班级列表加载失败。</span>
              <button class="btn" id="retryClasses" type="button">重新加载</button>
            </div>
          </section>

          <section
            class="card class-detail-card"
            id="classDetail"
            aria-labelledby="classDetailTitle"
            hidden
          >
            <div class="class-section-head">
              <div>
                <p class="class-detail-kicker">班级详情</p>
                <h2 id="classDetailTitle">班级</h2>
              </div>
              <div class="class-detail-actions">
                <button class="btn" id="editClassBtn" type="button" hidden>编辑</button>
                <button class="btn primary" id="publishClassBtn" type="button" hidden>发布</button>
                <button class="btn" id="archiveClassBtn" type="button" hidden>归档</button>
                <button class="btn danger" id="deleteClassBtn" type="button" hidden>删除班级</button>
                <button class="btn" id="closeDetail" type="button">返回列表</button>
              </div>
            </div>
            <dl class="class-detail-grid" id="classDetailFields"></dl>
            <div class="class-detail-error" id="classDetailError" hidden></div>

            <div class="class-relations" id="classRelations" hidden>
              <section class="class-relation-section" aria-labelledby="classMembersTitle">
                <div class="class-relation-head">
                  <div>
                    <h3 id="classMembersTitle">成员</h3>
                    <p class="muted" id="classMembersMeta">加载中</p>
                  </div>
                  <button class="btn" id="syncClassEnrollments" type="button">同步课程开通</button>
                  <form class="class-relation-form" id="enrollMemberForm">
                    <label>
                      <span>学员 ID</span>
                      <input
                        id="memberStudentId"
                        name="student_id"
                        type="number"
                        min="1"
                        inputmode="numeric"
                        required
                      />
                    </label>
                    <button class="btn primary" type="submit">入班</button>
                    <button class="btn" id="openMemberBulkImport" type="button">批量导入</button>
                  </form>
                </div>
                <div class="table-wrap class-relation-table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>学员</th>
                        <th>状态</th>
                        <th>课程开通</th>
                        <th>加入时间</th>
                        <th>退出时间</th>
                        <th class="class-action-col">操作</th>
                      </tr>
                    </thead>
                    <tbody id="classMemberRows"></tbody>
                  </table>
                </div>
                <div class="class-relation-empty" id="classMemberEmpty" hidden>暂无成员关系</div>
                <button
                  class="btn-text class-history-toggle"
                  id="toggleMemberHistory"
                  type="button"
                  hidden
                >
                  显示历史
                </button>
              </section>

              <section class="class-relation-section" aria-labelledby="classTeachersTitle">
                <div class="class-relation-head">
                  <div>
                    <h3 id="classTeachersTitle">带班教师</h3>
                    <p class="muted" id="classTeachersMeta">加载中</p>
                  </div>
                  <form class="class-relation-form class-teacher-form" id="assignTeacherForm">
                    <label>
                      <span>后台账号 ID</span>
                      <input
                        id="teacherAdminId"
                        name="admin_user_id"
                        type="number"
                        min="1"
                        inputmode="numeric"
                        required
                      />
                    </label>
                    <label>
                      <span>班内角色</span>
                      <select id="teacherRole" name="role_in_class" required></select>
                    </label>
                    <button class="btn primary" type="submit">指派</button>
                  </form>
                </div>
                <div class="table-wrap class-relation-table-wrap">
                  <table>
                    <thead>
                      <tr>
                        <th>教师</th>
                        <th>班内角色</th>
                        <th>指派时间</th>
                        <th>结束时间</th>
                        <th class="class-action-col">操作</th>
                      </tr>
                    </thead>
                    <tbody id="classTeacherRows"></tbody>
                  </table>
                </div>
                <div class="class-relation-empty" id="classTeacherEmpty" hidden>暂无带班关系</div>
                <button
                  class="btn-text class-history-toggle"
                  id="toggleTeacherHistory"
                  type="button"
                  hidden
                >
                  显示历史
                </button>
              </section>
            </div>
          </section>
        </main>
      </div>
    </div>
    <div class="modal-mask class-form-mask" id="classFormMask" hidden inert>
      <section
        class="modal narrow"
        role="dialog"
        aria-modal="true"
        aria-labelledby="classFormTitle"
      >
        <header class="modal-head">
          <h2 id="classFormTitle">新建班级</h2>
          <button class="icon-btn" id="closeClassForm" type="button" aria-label="关闭">×</button>
        </header>
        <div class="modal-body form-only class-form-body">
          <div class="form-field">
            <label for="classFormName">班级名称 <b class="req">*</b></label>
            <input id="classFormName" type="text" maxlength="200" autocomplete="off" required />
            <p class="field-error" id="classFormNameError" hidden></p>
          </div>
          <div class="form-field">
            <label for="classFormCourseId">课包 ID <b class="req">*</b></label>
            <input id="classFormCourseId" type="number" min="1" step="1" inputmode="numeric" required />
            <p class="field-error" id="classFormCourseIdError" hidden></p>
          </div>
          <div class="class-form-dates">
            <div class="form-field">
              <label for="classFormStartAt">开始时间</label>
              <input id="classFormStartAt" type="datetime-local" />
            </div>
            <div class="form-field">
              <label for="classFormEndAt">结束时间</label>
              <input id="classFormEndAt" type="datetime-local" />
            </div>
          </div>
          <p class="field-error" id="classFormDateError" hidden></p>
          <p class="muted" id="classFormHint">班级创建后由服务端确定当前状态。</p>
        </div>
        <footer class="modal-foot">
          <span class="spacer"></span>
          <button class="btn" id="cancelClassForm" type="button">取消</button>
          <button class="btn primary" id="saveClassForm" type="button">保存班级</button>
        </footer>
      </section>
    </div>
    <div class="modal-mask class-member-import-mask" id="memberBulkImportMask" hidden>
      <section
        class="modal narrow"
        role="dialog"
        aria-modal="true"
        aria-labelledby="memberBulkImportTitle"
      >
        <header class="modal-head">
          <h2 id="memberBulkImportTitle">批量导入成员</h2>
          <button class="icon-btn" id="closeMemberBulkImport" type="button" aria-label="关闭">×</button>
        </header>
        <div class="modal-body form-only class-member-import-body">
          <p class="muted">选择后一次导入当前班级。每名学员独立处理，失败项会保留在结果报告中。</p>
          <div id="memberBulkStudentPicker"></div>
          <p class="class-member-import-selection" id="memberBulkImportSelection" aria-live="polite">已选择 0 名学员</p>
          <div class="class-member-import-progress" id="memberBulkImportProgress" hidden aria-live="polite"></div>
          <div class="class-member-import-result" id="memberBulkImportResult" hidden aria-live="polite"></div>
        </div>
        <footer class="modal-foot">
          <span class="spacer"></span>
          <button class="btn" id="cancelMemberBulkImport" type="button">取消</button>
          <button class="btn primary" id="submitMemberBulkImport" type="button" disabled>导入成员</button>
        </footer>
      </section>
    </div>
    <script type="module" src="admin-api.js"></script>
    <script type="module" src="admin-layout.js"></script>
    <script type="module" src="classes.js"></script>
  </body>
</html>
