<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>视频管理 · 启程学堂后台</title>
  <!-- data: 空图标：阻止浏览器自动请求 /favicon.ico（否则每次打开页面都 404） -->
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="vendor/uppy/dashboard.css" />
  <link rel="stylesheet" href="vendor/videojs/video-js.css" />
  <style>
    .video-modal { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .video-modal-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); }
    /* 默认 ~960px 宽（学 B 站中窗，比 720 更舒展；竖屏视频在 16:9 黑底区域内居中留白）。
   视频源什么比例就显示什么比例（不预设容器宽高比），容器 aspect-ratio 16:9 固定，
   max-height: 75vh 兜底防溢出。 */
    .video-modal-box { position: relative; width: min(960px, 94vw); background: #111; border-radius: 10px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,.5); display: flex; flex-direction: column; }
    .video-modal-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; color: #ddd; background: #1a1d22; font-size: 14px; flex-shrink: 0; }
    .video-modal-head .btn-text { color: #bbb; }
    .video-modal-box .video-js-wrap { background: #000; width: 100%; aspect-ratio: 16 / 9; max-height: 75vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    /* video 元素填满容器，object-fit: contain 保证按源比例居中显示（不变形不裁切）。
       容器 aspect-ratio 16:9 固定 → 转圈/播放窗口尺寸一致，不跳变。 */
    .video-modal-box .video-js-wrap video { width: 100% !important; height: 100% !important; object-fit: contain; }
    /* 自定义按钮图标（截图/画质）：内联 SVG 填满按钮 */
    .video-modal-box .vjs-icon-placeholder { display: inline-flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
    .video-modal-box .vjs-icon-placeholder svg { display: block; }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <div>
          <h1>视频管理</h1>
          <p>Uppy 分片直传 MinIO，服务端不碰字节；上传完成进入转码队列。</p>
        </div>
      </div>

      <div class="card">
        <div id="uppy-dashboard"></div>
        <div class="muted" style="margin-top: 10px; font-size: 13px" id="upload-hint">
          建议 1080p/30fps 以下、单文件 ≤ 2GB。视频直传后由后台转码为多码率 HLS。
        </div>
      </div>

      <div class="card" style="margin-top: 16px">
        <div class="card-head">
          <h2>最近上传</h2>
        </div>
        <table class="table" id="video-list">
          <thead>
            <tr><th>ID</th><th>标题</th><th>大小</th><th>状态</th><th>上传时间</th><th>操作</th></tr>
          </thead>
          <tbody><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- 播放预览模态框 -->
<div class="video-modal" id="video-modal" hidden>
  <div class="video-modal-backdrop" data-video-close></div>
  <div class="video-modal-box">
    <div class="video-modal-head">
      <b id="video-modal-title">视频预览</b>
      <button class="btn-text" data-video-close type="button">✕ 关闭</button>
    </div>
    <!-- 播放器容器：每次打开清空内部重建 <video>（videojs dispose 会移除 video 元素）。
         容器自身不重建，保证 CSS（max-height: 75vh 等）一直生效。 -->
    <div class="video-js-wrap" id="video-player-wrap"></div>
  </div>
</div>

<script type="module" src="admin-api.js"></script>
<script type="module" src="admin-layout.js"></script>
<script type="module" src="vendor/uppy/uppy.esm.js"></script>
<!-- video.js 用官方 UMD 构建（含 VHS/HLS 支持，暴露 window.videojs）：esbuild 打包的
     ESM 版在浏览器里 VHS source handler 注册不生效，会报 MEDIA_ERR_SRC_NOT_SUPPORTED。 -->
<script src="vendor/videojs/video.min.js"></script>
<script src="vendor/videojs/extensions.js?v=20260809b"></script>
<script type="module" src="videos.js"></script>
</body>
</html>
