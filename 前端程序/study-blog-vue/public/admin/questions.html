            });
            zipPanel.addEventListener("dragleave", () => (zipPanel.style.background = "#f7fbff"));
            zipPanel.addEventListener("drop", (event) => {
              event.preventDefault();
              zipPanel.style.background = "#f7fbff";
              chooseZipFile(event.dataTransfer?.files?.[0]);
            });
            uploadButton.addEventListener("click", async () => {
              const file = selectedZipFile || zipInput.files?.[0];
              if (!file) {
                statusNode.textContent = "请选择一个 .zip 文件。";
                return;
              }
              if (!editingId) {
                pendingCppZipFile = file;
                statusNode.textContent = "ZIP 已暂存；点击“保存草稿”后会自动上传。";
                return;
              }
              uploadButton.disabled = true;
              statusNode.textContent = "正在上传并解析…";
              const dirtyBeforeUpload = isDirty();
              try {
                const data = new FormData();
                data.append("archive", file);
                const result = await adminUpload(`/problems/${editingId}/testdata-zip`, data, {
                  headers: ifMatch(formState.revision),
                });
                p.testDataPackage = {
                  archive_name: file.name,
                  checker: result.checker,
                  manifest: result.manifest,
                };
                // ZIP 的 config.yaml 会覆盖题目级限制（保留覆盖），回填表单让下次保存不丢。
                p.timeLimitMs = result.time_limit_ms ?? p.timeLimitMs;
                p.memoryLimitMb = result.memory_limit_mb ?? p.memoryLimitMb;
                formState.revision = result.revision;
                pendingCppZipFile = null;
                if (!dirtyBeforeUpload) initialSnapshot = snapshot();
                renderAll();
                toast(`测试数据导入成功，共 ${result.case_count} 个测试点。`);
              } catch (error) {
                const message = error.message || "上传失败。";
                statusNode.textContent = message;
                toast(message, "error");
                uploadButton.disabled = false;
              }
            });
            box.appendChild(zipPanel);
            // 导入后的清单表格：分值 / 限时 / 内存**逐点可改**。ZIP 只负责给测试点的内容，
            // 为了把某个点的分值从 10 调成 20 就重新打包上传一次，是没有道理的。
            // 限时/内存留空 = 继承题目级；分值留空 = 不单独计分（判分时等权）。
            const manifestTitle = document.createElement("h4");
            manifestTitle.className = "sec-title";
            manifestTitle.style.cssText = "margin:14px 0 8px";
            manifestTitle.textContent = "已导入测试点";
            box.appendChild(manifestTitle);
            const manifestHint = document.createElement("p");
            manifestHint.className = "muted";
            manifestHint.style.cssText = "margin:0 0 8px";
            manifestHint.textContent = "分值 / 限时 / 内存可以逐点单独设置：限时、内存留空表示继承题目级，分值留空表示该点不单独计分。改完点下方按钮保存。";
            box.appendChild(manifestHint);
            const manifestTable = document.createElement("table");
            manifestTable.innerHTML = `<thead><tr><th>#</th><th>分值</th><th>限时(ms)</th><th>内存(MB)</th><th>数据</th></tr></thead><tbody></tbody>`;
            box.appendChild(manifestTable);
            const manifestBar = document.createElement("div");
            manifestBar.style.cssText = "display:flex;align-items:center;gap:10px;margin-top:8px";
            const saveCasesBtn = document.createElement("button");
            saveCasesBtn.className = "btn";
            saveCasesBtn.type = "button";
            saveCasesBtn.textContent = "保存测试点设置";
            // 整包下载：拿回 N.in / N.out + 按当前库值生成的 config.yaml，
            // 改完可以直接重新上传，是闭合的。
            const downloadAllBtn = document.createElement("button");
            downloadAllBtn.className = "btn";
            downloadAllBtn.type = "button";
            downloadAllBtn.textContent = "下载全部（ZIP）";
            // 只读（查看）模式下也要能点：下载是读动作，见 applyModalAccess
            downloadAllBtn.dataset.readAction = "";
            const casesStatus = document.createElement("span");
            casesStatus.className = "muted";
            manifestBar.append(saveCasesBtn, downloadAllBtn, casesStatus);
            box.appendChild(manifestBar);

            /** 统一的下载入口：未保存的草稿没有服务端文件可下，先拦住。 */
            async function downloadTestdata(path, fallbackName) {
              if (!editingId) {
                casesStatus.textContent = "请先保存草稿。";
                return;
              }
              try {
                casesStatus.textContent = "正在准备下载…";
                const name = await adminDownload(`/problems/${editingId}${path}`, fallbackName);
                casesStatus.textContent = `已下载 ${name}`;
              } catch (error) {
                casesStatus.textContent = error.message || "下载失败。";
                toast(error.message || "下载失败。", "error");
              }
            }
            downloadAllBtn.addEventListener("click", () =>
              downloadTestdata("/testdata/archive", "testdata.zip"),
            );

            const manifestRows = () =>
              (p.testDataPackage?.manifest || []).slice().sort((a, b) => a.case_no - b.case_no);
            function drawManifest() {
              const rows = manifestRows();
              const body = manifestTable.querySelector("tbody");
              body.innerHTML = "";
              rows.forEach((entry) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
              <td>${entry.case_no}</td>
              <td><input class="mc-score mono" type="number" min="0" max="1000" placeholder="等权" /></td>
              <td><input class="mc-time mono" type="number" min="100" max="10000" step="100" placeholder="继承 ${p.timeLimitMs ?? 1000}" /></td>
              <td><input class="mc-mem mono" type="number" min="16" max="512" placeholder="继承 ${p.memoryLimitMb ?? 256}" /></td>
              <td style="white-space:nowrap">
                <a class="link mc-in" role="button" tabindex="0">输入</a>
                <a class="link mc-out" role="button" tabindex="0" style="margin-left:8px">输出</a>
              </td>`;
                tr.querySelector(".mc-in").addEventListener("click", () =>
                  downloadTestdata(`/testdata/cases/${entry.case_no}?side=in`, `${entry.case_no}.in`),
                );
                tr.querySelector(".mc-out").addEventListener("click", () =>
                  downloadTestdata(`/testdata/cases/${entry.case_no}?side=out`, `${entry.case_no}.out`),
                );
                const bind = (selector, key) => {
                  const input = tr.querySelector(selector);
                  input.value = entry[key] ?? ""; // 空 = 继承 / 等权，与 null 一一对应
                  input.addEventListener("input", (event) => {
                    entry[key] = event.target.value === "" ? null : Number(event.target.value);
                    casesStatus.textContent = "有未保存的改动。";
                  });
                };
                bind(".mc-score", "score");
                bind(".mc-time", "time_limit_ms");
                bind(".mc-mem", "memory_limit_mb");
                body.appendChild(tr);
              });
              const empty = rows.length === 0;
              saveCasesBtn.disabled = empty;
              downloadAllBtn.disabled = empty;
              manifestBar.style.display = empty ? "none" : "flex";
            }
            saveCasesBtn.addEventListener("click", async () => {
              if (!editingId) {
                casesStatus.textContent = "请先保存草稿。";
                return;
              }
              const rows = manifestRows();
              const bad = (value, lo, hi) => value != null && !(Number.isInteger(value) && value >= lo && value <= hi);
              const invalid = rows.find(
                (entry) => bad(entry.score, 0, 1000) || bad(entry.time_limit_ms, 100, 10000) || bad(entry.memory_limit_mb, 16, 512),
              );
              if (invalid) {
                casesStatus.textContent = `测试点 ${invalid.case_no} 的取值超出范围（分值 0–1000、限时 100–10000ms、内存 16–512MB）。`;
                return;
              }
              const dirtyBefore = isDirty();
              saveCasesBtn.disabled = true;
              casesStatus.textContent = "保存中…";
              try {
                const result = await adminRequest(`/problems/${editingId}/testdata-cases`, {
                  method: "PUT",
                  headers: ifMatch(formState.revision),
                  body: JSON.stringify({
                    cases: rows.map((entry) => ({
                      case_no: entry.case_no,
                      score: entry.score ?? null,
                      time_limit_ms: entry.time_limit_ms ?? null,
                      memory_limit_mb: entry.memory_limit_mb ?? null,
                    })),
                  }),
                });
                p.testDataPackage = { ...p.testDataPackage, manifest: result.manifest };
                formState.revision = result.revision;
                if (!dirtyBefore) initialSnapshot = snapshot();
                casesStatus.textContent = "已保存。";
                drawManifest();
                toast("测试点设置已保存。");
              } catch (error) {
                casesStatus.textContent = error.message || "保存失败。";
                toast(error.message || "保存失败。", "error");
              } finally {
                saveCasesBtn.disabled = false;
              }
            });
            drawManifest();
            return box;
          }
          const tcTable = document.createElement("table");
          tcTable.innerHTML = `<thead><tr><th>#</th><th>类型</th><th>输入</th><th>输出</th><th>限时(ms)</th><th>内存(MB)</th><th>操作</th></tr></thead><tbody></tbody>`;
          box.appendChild(tcTable);
          const tcBody = tcTable.querySelector("tbody");
          function drawTC() {
            tcBody.innerHTML = "";
            p.manualTestCases.forEach((tc, i) => {
              const tr = document.createElement("tr");
              tr.innerHTML = `
            <td>${i + 1}</td>
            <td>隐藏</td>
            <td><textarea class="tc-in mono" rows="3" placeholder="输入"></textarea></td>
            <td><textarea class="tc-out mono" rows="3" placeholder="输出"></textarea></td>
            <td><input class="tc-time mono" type="number" min="100" max="10000" step="100" placeholder="继承 ${p.timeLimitMs ?? 1000}" /></td>
            <td><input class="tc-mem mono" type="number" min="16" max="512" placeholder="继承 ${p.memoryLimitMb ?? 256}" /></td>
            <td><a class="link danger remove-tc">删除</a></td>`;
              tr.querySelector(".tc-in").value = tc.input;
              tr.querySelector(".tc-out").value = tc.output;
              const timeInput = tr.querySelector(".tc-time");
              const memInput = tr.querySelector(".tc-mem");
              timeInput.value = tc.timeLimitMs ?? ""; // 空 = 继承题目级
              memInput.value = tc.memoryLimitMb ?? "";
              tr.querySelector(".tc-in").addEventListener(
                "input",
                (e) => (tc.input = e.target.value),
              );
              tr.querySelector(".tc-out").addEventListener(
                "input",
                (e) => (tc.output = e.target.value),
              );
              timeInput.addEventListener("input", (e) => {
                tc.timeLimitMs = e.target.value === "" ? null : Number(e.target.value);
              });
              memInput.addEventListener("input", (e) => {
                tc.memoryLimitMb = e.target.value === "" ? null : Number(e.target.value);
              });
              tr.querySelector(".remove-tc").addEventListener("click", () => {
                p.manualTestCases.splice(i, 1);
                drawTC();
              });
              tcBody.appendChild(tr);
            });
          }
          const addTcBtn = document.createElement("button");
          addTcBtn.className = "btn";
          addTcBtn.type = "button";
          addTcBtn.textContent = "＋ 添加测试点";
          addTcBtn.addEventListener("click", () => {
            p.manualTestCases.push({ input: "", output: "", timeLimitMs: null, memoryLimitMb: null });
            drawTC();
          });
          box.appendChild(addTcBtn);
          drawTC();
          return box;
        },

        analysis() {
          const box = document.createElement("div");
          box.className = "form-grid";
          box.style.cssText = "margin-top:16px";
          box.innerHTML = `
            <div class="field full markdown-editor-field" role="group" aria-label="答案解析">
              <div class="markdown-editor-label">答案解析（Markdown）</div>
              <div class="q-edit"></div>
            </div>`;
          markdownInstances.push(
            mountMarkdownEditor(
              box.querySelector(".q-edit"),
              formState.analysis,
              (markdown) => (formState.analysis = markdown),
              "选填",
            ),
          );
          return box;
        },

        analysisVideo() {
          const box = document.createElement("div");
          box.className = "form-grid";
          box.style.cssText = "margin-top:16px";
          box.innerHTML = `
            <div class="field full" role="group" aria-label="解析视频">
              <div class="markdown-editor-label">解析视频（选填）</div>
              <div class="av-area" data-av-mount></div>
              <p class="muted" style="margin-top:8px">大加号点击或拖拽视频文件上传（mp4/mkv/mov 等，≤2GB）。学生提交作答或交卷后才可观看，避免提前泄题。</p>
            </div>`;
          mountAnalysisVideoArea(box.querySelector("[data-av-mount]"), {
            videoId: () => formState.analysisVideoId,
            setVideoId: (id) => {
              formState.analysisVideoId = id;
              formState.hasAnalysisVideo = !!id;
            },
            // 状态优先取「本会话刚上传」的，其次取已保存绑定的（后端 analysis_video_status）
            status: () => formState.uploadedVideoStatus || formState.analysisVideoStatus,
            setStatus: (status) => {
              formState.uploadedVideoStatus = status;
              formState.analysisVideoStatus = status;
            },
            uploadedId: () => formState.uploadedVideoId,
            setUploadedId: (id, status) => {
              formState.uploadedVideoId = id;
              formState.uploadedVideoStatus = status;
            },
            onSaved: () => {
              // 保存成功后本会话上传的视频转为正式绑定，不再显示「删除（彻底）」入口
              formState.uploadedVideoId = null;
              formState.uploadedVideoStatus = null;
            },
          });
          return box;
        },
      };

      // =====================================================================
      // 解析视频上传区：大加号 + 拖拽（Uppy Dashboard）+ 上传后可查看/删除。
      //
      // 交互状态机：
      //   · 未绑定（videoId 为空）→ 大加号上传区（点击选文件 / 拖拽进框）。
      //   · 上传成功 → 视频卡片（状态标签 + 预览 + 删除按钮）。
      //   · 删除 → 先调 DELETE /api/admin/videos/{id} 彻底删（未引用才放行）；
      //     已绑定题目的视频会 409 → 前端收到 409 仍解绑本题引用（视频资产保留在库）。
      // 复用 videos.js 同款 Uppy + S3 Multipart 直传管道（vendor 已内置，零新依赖）。
      // =====================================================================
      const AV_PART_SIZE = 64 * 1024 * 1024; // 与后端 settings.video_part_size 一致
      const AV_MAX_BYTES = 2 * 1024 * 1024 * 1024; // 与后端 video_source_max_bytes 一致
      let avUppy = null; // 当前表单区的 Uppy 实例（重渲染前 destroy）
      let avPlayer = null; // videojs 预览实例（就地展开，dispose 复用）

      function avUploadedVideoStatusLabel(status) {
        return { draft: "待上传", uploaded: "已上传待转码", transcoding: "转码中", ready: "可播放", failed: "转码失败" }[status] || status || "处理中";
      }

      /** 视频卡片：状态 + 预览（就地展开 videojs）+ 删除。 */
      function renderAvCard(mount, api, { readonly = false } = {}) {
        mount.innerHTML = `
          <div class="av-card">
            <div class="av-card-info">
              <span class="node-badge trial">视频 #${api.videoId()}</span>
              <span class="node-badge warn">${avUploadedVideoStatusLabel(api.status())}</span>
              <span class="muted">解析视频将在学生提交后开放观看</span>
            </div>
            <div class="av-card-actions">
              <button class="btn" type="button" data-av-preview>预览</button>
              ${readonly ? "" : '<button class="btn danger" type="button" data-av-remove>删除</button>'}
            </div>
            <div class="av-preview-wrap" hidden></div>
          </div>`;
        const previewWrap = mount.querySelector(".av-preview-wrap");
        const playable = api.status() === "ready";
        const previewBtn = mount.querySelector("[data-av-preview]");
        previewBtn.disabled = !playable;
        previewBtn.title = playable ? "" : "转码完成后可预览";
        previewBtn.addEventListener("click", async () => {
          if (!playable) return;
          if (previewWrap.hidden) {
            previewWrap.hidden = false;
            previewWrap.innerHTML = '<div class="av-player-slot"></div>';
            avPlayer?.dispose?.();
            avPlayer = null;
            try {
              const data = await adminRequest(`/videos/${api.videoId()}/play`, {
                method: "POST",
                body: "{}",
              });
              const slot = previewWrap.querySelector(".av-player-slot");
              const videoEl = document.createElement("video");
              videoEl.className = "video-js vjs-big-play-centered";
              videoEl.setAttribute("playsinline", "");
              slot.appendChild(videoEl);
              avPlayer = videojs(videoEl, {
                controls: true,
                fluid: true,
                autoplay: false,
                sources: [{ src: data.master_playlist, type: "application/vnd.apple.mpegurl" }],
              });
            } catch (err) {
              toast(err?.message || "预览失败，请稍后再试。", "error");
            }
          } else {
            avPlayer?.dispose?.();
            avPlayer = null;
            previewWrap.hidden = true;
            previewWrap.innerHTML = "";
          }
        });
        mount.querySelector("[data-av-remove]").addEventListener("click", async () => {
          const id = api.videoId();
          if (!id) return;
          const ok = await confirmDialog({
            title: "删除解析视频",
            message: "删除后本题将不再关联该视频；未绑定的视频资产会被一并清除。确定删除？",
            confirmText: "删除",
            danger: true,
          });
          if (!ok) return;
          try {
            await adminRequest(`/videos/${id}`, { method: "DELETE" });
            toast(`视频 #${id} 已删除。`);
          } catch (err) {
            // 409 = 视频被引用（通常是本题已保存过绑定）：仍解除本题引用，资产保留在库。
            if (err?.status === 409) toast("该视频已被题目引用，已解除本题绑定；如需彻底删除请到视频管理页处理。");
            else toast(err?.message || "删除失败，请重试。", "error");
          }
          api.setVideoId(null);
          api.setStatus && api.setStatus(null);
          mountAnalysisVideoArea(mount, api);
        });
      }

      /** 大加号上传区：Uppy Dashboard（inline，小尺寸），拖拽 + 点击。 */
      function renderAvUploader(mount, api) {
        mount.innerHTML = '<div class="av-uppy"></div>';
        const target = mount.querySelector(".av-uppy");
        avUppy?.destroy?.();
        avUppy = new Uppy({
          autoProceed: false,
          restrictions: {
            maxFileSize: AV_MAX_BYTES,
            allowedFileTypes: ["video/*", ".mkv", ".mov", ".m4v", "application/octet-stream"],
          },
        });
        avUppy.use(Dashboard, {
          inline: true,
          target,
          showProgressDetails: true,
          proudlyDisplayPoweredByUppy: false,
          height: 220,
        });
        avUppy.use(AwsS3, {
          shouldUseMultipart: () => true,
          getChunkSize: () => AV_PART_SIZE,
          limit: 3,
          async createMultipartUpload(file) {
            const res = await adminRequest("/videos/uploads", {
              method: "POST",
              body: JSON.stringify({
                title: file.name.replace(/\.[^.]+$/, "") || file.name,
                filename: file.name,
                content_type: file.type || "application/octet-stream",
                file_size: file.size,
              }),
            });
            return { uploadId: res.upload_id, key: res.object_key };
          },
          async signPart(file, { uploadId, key, partNumber }) {
            const res = await adminRequest(`/videos/uploads/${uploadId}/parts/${partNumber}`);
            return { url: res.url };
          },
          async completeMultipartUpload(file, { uploadId, key, parts }) {
            const res = await adminRequest(`/videos/uploads/${uploadId}/complete`, {
              method: "POST",
              body: JSON.stringify({
                parts: parts.map((p) => ({ part_number: p.PartNumber, etag: p.ETag })),
              }),
            });
            return { location: "", video_id: res.video_id };
          },
          async abortMultipartUpload(file, { uploadId, key }) {
            await adminRequest(`/videos/uploads/${uploadId}/abort`, { method: "POST", body: "{}" });
          },
        });
        avUppy.on("upload-success", (file, response) => {
          const body = response?.body || response;
          const id = body?.video_id;
          if (!id) return;
          toast(`视频 #${id} 上传完成，已进入转码队列。`);
          // 上传成功即视为本题解析视频；未保存前标记为本会话上传（可彻底删除）。
          api.setUploadedId(id, "uploaded");
          api.setVideoId(id);
          api.setStatus && api.setStatus("uploaded");
          mountAnalysisVideoArea(mount, api);
        });
        avUppy.on("upload-error", (file, error) => {
          console.error("av-upload-error", error);
          toast(error?.message || "上传失败，请重试。", "error");
        });
      }

      /** 解析视频区入口：按当前绑定态渲染卡片或上传区；只读态只展示不编辑。 */
      function mountAnalysisVideoArea(mount, api) {
        if (api.videoId()) {
          renderAvCard(mount, api, { readonly: modalReadOnly });
        } else if (modalReadOnly) {
          mount.innerHTML = '<p class="muted">未配置解析视频。</p>';
        } else {
          renderAvUploader(mount, api);
        }
      }

      /** 全局销毁（换题/关弹窗时调用）：释放 Uppy 与 videojs 实例。 */
      function destroyAnalysisVideoArea() {
        avUppy?.destroy?.();
        avUppy = null;
        avPlayer?.dispose?.();
        avPlayer = null;
      }

      // 填空：MathLive placeholder 的唯一标识是主键；位置变化后答案仍与原标识关联。
      // 题干编辑器同时接受可视空位（___ 或 {{blank}}），保存前统一转为稳定标识。
      // 注意：连续空格不再识别为空位——会误判正文双空格、行首缩进、行尾硬换行、行内代码等。
      // 花括号内允许有内容（如 \placeholder[blank_1]{提示}），与后端 BLANK_KEY_RE 保持一致；
      // normalizeFillStem 会在保存前收紧为空花括号的标准格式。
      const FILL_PLACEHOLDER_RE = /\\placeholder\s*\[\s*([A-Za-z][A-Za-z0-9_-]{0,63})\s*\]\s*\{\s*[^{}]*\s*\}/g;
      const VISUAL_BLANK_RE = /\{\{blank\}\}|_{3,}/g;

      function fillKeysFromStem(stem) {
        return [...stem.matchAll(FILL_PLACEHOLDER_RE)].map((match) => match[1]);
      }

      function nextFillBlankKey(stem) {
        const usedKeys = new Set(fillKeysFromStem(stem));
        let index = 1;
        while (usedKeys.has(`blank_${index}`)) index += 1;
        return `blank_${index}`;
      }

      function normalizeFillStem(stem) {
        // 先收紧手工输入的 placeholder，保证前后端保存同一种格式。
        let normalized = stem.replace(FILL_PLACEHOLDER_RE, (_, key) => `\\placeholder[${key}]{}`);
        const usedKeys = new Set(fillKeysFromStem(normalized));
        let nextAutoKey = 1;
        const makeMarker = () => {
          let key;
          do {
            key = `blank_auto_${nextAutoKey++}`;
          } while (usedKeys.has(key));
          usedKeys.add(key);
          return `\\placeholder[${key}]{}`;
        };

        // Markdown 是纯文本；代码围栏内的缩进和下划线不能被识别成空位。
        let inFence = false;
        return normalized
          .split("\n")
          .map((line) => {
            if (/^\s*(`{3,}|~{3,})/.test(line)) {
              inFence = !inFence;
              return line;
            }
            return inFence ? line : line.replace(VISUAL_BLANK_RE, makeMarker);
          })
          .join("\n");
      }

      // 一个空常有多种写法（0.5 与 1/2、列表与 list）。界面上仍是一个输入框，
      // 多种写法用 | 分隔；答案里真要出现竖线就写 \|。发请求时拆成结构化的
      // { answer: 第一条, alternatives: 其余 }——库里存结构，界面留一个框。
      // 判分时几条写法平权，但展示给学员的「正确答案」永远是第一条。
      function splitBlankAnswers(text) {
        return String(text ?? "")
          .split(/(?<!\\)\|/) // 前面带反斜杠的竖线不当分隔符
          .map((item) => item.replace(/\\\|/g, "|").trim())
          .filter(Boolean);
      }

      function joinBlankAnswers(answer, alternatives) {
        return [answer, ...(alternatives || [])]
          .filter((item) => item != null && item !== "")
          .map((item) => String(item).replace(/\|/g, "\\|"))
          .join(" | ");
      }

        form.stem = normalizeFillStem(form.stem);

        form.fillBlanks = keys.map((blank_key, blank_index) => ({
          blank_index,
          blank_key,
          answer: answersByKey.get(blank_key) || "",
        }));
        return keys;
      }

        const answersByKey = new Map(
          formState.fillBlanks.map((blank) => [blank.blank_key, blank.answer]),
        );
        return syncFillBlanksFor(formState, answersByKey);
      }

      // 知识点树选择器：实现在 admin-tagtree.js（触发区 chips + 浮层三级树）。
      // 叶子 id 由编号生成：0.1.1 → 0-1-1（全树唯一；后端标签驱动时用数据库 id 覆盖）
      function assignKnowledgeIds(nodes) {
        nodes.forEach((n) => {
          n.id = n.num.replace(/\./g, "-");
          if (n.children) assignKnowledgeIds(n.children);
        });
      }
      assignKnowledgeIds(KNOWLEDGE_TREE);
      const kt = createKnowledgeTree({
        els: {
          trigger: document.getElementById("ktTrigger"),
          hint: document.getElementById("ktHint"),
          pop: document.getElementById("ktPop"),
          filter: document.getElementById("ktFilter"),
          tree: document.getElementById("ktTree"),
          summary: document.getElementById("ktSummary"),
          scrollContext: document.querySelector(".modal-left"),
        },
        // 选中项归一化后回写受控表单；Modal 未打开时 formState 为 null。
        onChange: (ids) => { if (formState) formState.common.knowledge = ids; },
      });
      kt.setTree(KNOWLEDGE_TREE); // 本地树兜底，GET /api/admin/tags 成功后覆盖

      function switchType(newType) {
        // 只重置题型专属字段：通用标签、题干、解析保留；
        // 题目身份（id/版本/负责人/权限）更不能丢——否则编辑态换题型后
        // revision 变成 null，后续 PUT 携带的 If-Match 会被后端拒绝。
        const preserved = {
          common: formState.common,
          stem: formState.stem,
          analysis: formState.analysis,
          status: formState.status,
          revision: formState.revision,
          owner: formState.owner,
          allowedActions: formState.allowedActions,
          rejection: formState.rejection,
          scratch: formState.scratch,
        };
        formState = { ...emptyForm(), ...preserved, type: newType };
        if (newType === "fill") syncFillBlanks(); // 进入填空时按标记重建空位
        renderAll();
      }

      document.getElementById("typeGroup").addEventListener("change", (e) => {
        const input = e.target.closest('input[name="qType"]');
        if (input) switchType(input.value);
      });
      document.querySelectorAll('input[name="qLang"]').forEach((r) => {
        r.addEventListener("change", () => {
          formState.subType = document.querySelector('input[name="qLang"]:checked').value;
          // 作品题只对 Python 开放（后端 ProblemPayload 也会拒）。切到 C++ 时把形态
          // 拉回算法题，否则表单停在一个保存必然 422 的状态上，而错误信息出现在
          // 提交之后——那时老师已经填了一屏作品题字段。
          if (formState.subType !== "python") setShape("algorithm");
          renderAll(); // subType 影响参考代码默认语言

      // 换形态时必须把它带到新形态的默认值上，否则保存会被跨形态取值拒掉。
      function setShape(shape) {
        const p = formState.programming;
        if (p.shape === shape) return;
        p.shape = shape;
        p.passCondition = shape === "project" ? "规则全通过" : "全测试点通过";

      // 通用标签回写 formState.common（切换 type 不受影响）
      const readCommon = () => {

        formState.common.difficulty = input("qDifficulty") || "入门";

      // =====================================================================
      // 五、保存/提交：收集 formState 为提交结构（对齐最终组件数据格式）
      // =====================================================================
      function buildPayload() {
        readCommon();
        syncFillBlanks();
        const payload = {
          type: formState.type,
          sub_type: formState.type === "programming" ? formState.subType : null,
          common: {
            ...formState.common,
            // 知识点：状态存叶子 id，payload 输出名称（后端 tags 表就位后直接存 id）
            knowledge: formState.common.knowledge.map(kt.nameOf),
          },
          stem: formState.stem, // Markdown 源码
          analysis: formState.analysis,
          // 解析视频：绑定已上传成功的 video_id；「移除」后为 null（不传则保持后端原值，
          // 这里显式给出，保证移除操作能真的解绑）。
          analysis_video_id: formState.analysisVideoId ?? null,
        };
        if (formState.type === "choice" || formState.type === "multi_choice") {
          payload.options = formState.options.map((o) => ({
            content: o.content,
            is_correct: o.correct,
          }));
        } else if (formState.type === "judge") {
          payload.options = [
            { content: "对", is_correct: formState.judgeAnswer === "正确" },
            { content: "错", is_correct: formState.judgeAnswer === "错误" },
          ];
        } else if (formState.type === "fill") {
          payload.blanks = formState.fillBlanks.map((b) => {
            // 输入框里是 "0.5 | 1/2" 这样一行，拆成标准答案 + 其它可接受写法
            const [answer = "", ...alternatives] = splitBlankAnswers(b.answer);
            return {
              blank_index: b.blank_index,
              blank_key: b.blank_key,
              answer,
              alternatives,
            };
          });
        } else if (formState.type === "programming") {
          payload.programming = {
            title: formState.programming.title,
            pass_condition: formState.programming.passCondition,
            input_format: formState.programming.inputFormat,
            output_format: formState.programming.outputFormat,
            hints: formState.programming.hints,
            // ?? 兜底不能省：输入框清空时状态是 null，而后端这两个字段是必填 int，
            // 直接发 null 会 422，连"保存草稿"都存不上。
            time_limit_ms: formState.programming.timeLimitMs ?? 1000,
            memory_limit_mb: formState.programming.memoryLimitMb ?? 256,
            // 样例不带逐点限制，恒继承题目级
            samples: formState.programming.samples.map((s) => ({
              input: s.input,
              output: s.output,
            })),
            ref_code: {
              cpp: formState.subType === "cpp" ? formState.programming.refCode.cpp : "",
              python: formState.subType === "python" ? formState.programming.refCode.python : "",
            },
            manual_test_cases: formState.programming.manualTestCases.map((t) => ({
              input: t.input,
              output: t.output,
              time_limit_ms: t.timeLimitMs ?? null,
              memory_limit_mb: t.memoryLimitMb ?? null,
            })),
          };
          // 形态互斥：后端 shape_fields_are_consistent 会拒绝"作品题带样例"或
          // "算法题带初始代码"。这里按形态把另一半清空再发，而不是把表单里残留的
          // 值原样送上去——老师从算法题改成作品题时，之前填的样例不该变成 422。
          const project = formState.programming;
          if (project.shape === "project") {
            payload.programming.shape = "project";
            payload.programming.input_format = "";
            payload.programming.output_format = "";
            payload.programming.samples = [];
            payload.programming.manual_test_cases = [];
            Object.assign(payload.programming, projectAssetsPayload(project).payload);
          } else {
            payload.programming.shape = "algorithm";
            payload.programming.starter_code = "";
            payload.programming.allowed_modules = [];
            payload.programming.rules = [];
            payload.programming.rubric = {};
          }
        }
        return payload;
      }

      function markdownToText(markdown = "") {
        let text = String(markdown);
        text = text
          .replace(/^\s*(?:```|~~~)[^\n]*$/gm, "")
          .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")
          .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")
          .replace(/^\s*#{1,6}\s+/gm, "")
          .replace(/^\s*>\s?/gm, "")
          .replace(/^\s*(?:[-*+]|\d+\.)\s+/gm, "")
          .replace(/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/gm, " ")
          .replace(FILL_PLACEHOLDER_RE, " ")
          .replace(/[*_~`|]/g, "");
        return text.replace(/\s+/g, " ").trim();
      }

      // 判空一律走这里，别再直接 `!markdownToText(...)`。与后端 _has_content() 同口径：
      // 图片单独算数，否则纯图题干（几何题就是一张图）和纯图选项（图形选择题）
      // 会被判成"没填"，在前端就提交不出去。
      function hasMarkdownContent(markdown = "") {
        return Boolean(markdownToText(markdown) || /!\[[^\]]*\]\([^)]*\)/.test(String(markdown)));
      }

      function codeFence(value, language = "text") {
        return `\n\n\`\`\`${language}\n${value || ""}\n\`\`\``;
      }

      function buildWholeProblemMarkdown() {
        const sections = [formState.stem || ""];
        if (formState.type === "choice" || formState.type === "multi_choice") {
          sections.push(
            formState.options
              .map((option, index) => `${optionLabel(index)}. ${option.content || ""}`)
              .join("\n"),
          );
        } else if (formState.type === "judge") {
          sections.push("A. 对\nB. 错");
        } else if (formState.type === "fill") {
          sections.push(
            formState.fillBlanks
              .map((blank, index) => {
                // 预览里把多种写法摊开成"标准答案（或：…）"，别原样甩一行带竖线的文本
                const [answer = "", ...alternatives] = splitBlankAnswers(blank.answer);
                const extra = alternatives.length ? `（或：${alternatives.join("、")}）` : "";
                return `空 ${index + 1}：${answer}${extra}`;
              })
              .join("\n"),
          );
        } else if (formState.type === "programming") {
          const p = formState.programming;
          const language = formState.subType === "python" ? "python" : "cpp";
          sections.push(
            `## ${p.title || "操作题"}\n\n### 输入格式\n${p.inputFormat || ""}\n\n### 输出格式\n${p.outputFormat || ""}\n\n### 提示\n${p.hints || ""}\n\n### 参考代码${codeFence(p.refCode[language], language)}`,
          );
          if (p.samples.length) {
            sections.push(
              p.samples
                .map(
                  (sample, index) =>
                    `### 样例 ${index + 1}\n输入${codeFence(sample.input)}\n输出${codeFence(sample.output)}`,
                )
                .join("\n\n"),
            );
          }
        }
        if (formState.analysis) sections.push(`## 答案解析\n\n${formState.analysis}`);
        return sections.filter((section) => section.trim()).join("\n\n");
      }
