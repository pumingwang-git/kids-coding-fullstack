<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>题库管理 · 后台</title>
    <link rel="stylesheet" href="admin.css" />
    <link rel="stylesheet" href="vendor/codemirror/codemirror.min.css" />
    <link rel="stylesheet" href="vendor/vditor/dist/index.css" />
    <link rel="stylesheet" href="vendor/uppy/dashboard.css" />
    <link rel="stylesheet" href="vendor/videojs/video-js.css" />
    <script src="vendor/dompurify/purify.min.js"></script>
    <script src="vendor/vditor/dist/index.min.js"></script>
    <script src="vendor/codemirror/codemirror.min.js"></script>
    <script src="vendor/codemirror/clike.min.js"></script>
    <script src="vendor/codemirror/python.min.js"></script>
    <!-- video.js 官方 UMD 构建（含 VHS/HLS，暴露 window.videojs）：解析视频预览用它播放 HLS，
         不要用 esbuild ESM bundle（其 VHS source handler 在浏览器里不注册）。 -->
    <script src="vendor/videojs/video.min.js"></script>
    <script src="vendor/videojs/extensions.js?v=20260809b"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="main">
        <header class="topbar" id="topbar"></header>
        <main class="content">
          <!-- ==================== 页面标题 + 标准检索栏 ==================== -->
          <div class="page-head">
            <div>
              <h1>题库管理</h1>
              <p>题目录入 / 标签管理 / 审核流转；通用标签与题型解耦</p>
            </div>
            <button class="btn primary" id="addBtn" type="button">＋ 新增试题</button>
          </div>

          <div class="card search-card">
            <div class="search-form">
              <div class="field">
                <label>关键词</label><input id="sKeyword" placeholder="题干 / 题目编号" />
              </div>
              <div class="field">
                <label>题型</label>
                <select id="sType" hidden>
                  <option value="">全部</option>
                  <option value="choice">选择</option>
                  <option value="multi_choice">多选</option>
                  <option value="judge">判断</option>
                  <option value="fill">填空</option>
                  <option value="programming">操作题</option>
                </select>
              </div>
              <div class="field">
                <label>难度</label
                ><select id="sDifficulty" hidden>
                  <option value="">全部</option>
                </select>
              </div>
              <div class="field">
                <label>来源</label
                ><select id="sSource" hidden></select>
              </div>
              <div class="field">
                <label>知识点</label
                ><select id="sTag" hidden></select>
              </div>
              <div class="field">
                <label>负责人</label
                ><select id="sOwner" hidden>
                  <option value="">全部</option>
                </select>
              </div>
              <div class="search-actions">
                <button class="btn primary" id="searchBtn" type="button">查询</button>
                <button class="btn" id="resetBtn" type="button">重置</button>
              </div>
            </div>
          </div>

          <!-- ==================== 草稿 / 待审核 / 已通过 / 已下线 ==================== -->
          <div class="card" style="margin-top: 20px">
            <div class="zone-tabs">
              <button data-zone="draft">
                草稿 <span class="count" id="draftCount">0</span>
              </button>
              <button data-zone="pending">
                待审核区 <span class="count" id="pendingCount">0</span>
              </button>
              <button class="active" data-zone="approved">
                已通过（已发布） <span class="count" id="approvedCount">0</span>
              </button>
            </div>
            <!-- 批量操作条：仅对当前勾选项中后端允许的动作放行 -->
            <div class="batch-bar" id="batchBar" hidden>
              已选 <b id="batchCount">0</b> 题<span class="spacer"></span>
              <button class="btn" id="batchSubmitBtn" type="button" hidden>批量提交审核</button>
              <button class="btn" id="batchApproveBtn" type="button" hidden>批量通过</button>
              <button class="btn danger" id="batchRejectBtn" type="button" hidden>批量打回</button>
              <button class="btn danger" id="batchDeleteBtn" type="button" hidden>批量删除</button>
              <button class="btn" id="batchClearBtn" type="button">取消选择</button>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th style="width: 34px">
                      <input type="checkbox" class="check" id="checkAll" aria-label="全选本页" />
                    </th>
                    <th style="width: 90px">编号</th>
                    <th style="width: 62px">题型</th>
                    <th>题干</th>
                    <th style="width: 96px">难度</th>
                    <th style="width: 76px">来源</th>
                    <th style="width: 88px">负责人</th>
                    <th style="width: 150px">知识点</th>
                    <th style="width: 78px">状态</th>
                    <th style="width: 190px">操作</th>
                  </tr>
                </thead>
                <tbody id="problemRows"></tbody>
              </table>
            </div>
            <div class="empty" id="emptyTip" hidden>没有符合条件的题目</div>
            <div class="list-error" id="errorTip" hidden>
              <span id="errorText">列表加载失败。</span>
              <button class="btn" id="retryBtn" type="button">重新加载</button>
            </div>
            <div class="pager">
              <span id="totalTip">共 0 条</span>
              <label class="muted">
                每页最多展示
                <select id="pageSize" aria-label="每页条数">
                  <option value="10">10</option>
                  <option value="20" selected>20</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                </select>
                条
              </label>
              <span class="spacer"></span
              ><button class="btn" id="prevPageBtn" type="button">‹ 上一页</button
              ><button class="btn" id="nextPageBtn" type="button">下一页 ›</button>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- ==================== 居中录入面板（受控 Modal） ==================== -->
    <div class="modal-mask" id="modalMask">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <header class="modal-head">
          <h2 id="modalTitle">新增试题</h2>
          <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
        </header>

        <div class="modal-body">
          <!-- 左：题型 + 通用标签（跨题型不变，切换 type 不清空） -->
          <!-- 左栏分两层：**开题必须决定的**常驻在上（题型 → 语言 → 形态、知识点、负责人），
               **有默认值、多数时候不用动的**收进下面的折叠区（难度/来源/结构/阶段/业务标签）。
               原来八块全展开，一屏三十多个胶囊竖着堆，新增一道题时真正要点的那两三个
               被淹在里面。折叠区的标题常驻显示当前取值摘要——收起不等于藏起来，
               否则老师会不放心而每次都点开，折叠就白做了。

               `data-left-block` 是显隐的依据。**别改回按 index 判断**：块的顺序一变，
               "index > 0 就隐藏"会静默地藏错东西，而这种错不会报任何错。 -->
          <div class="modal-left">
            <div class="left-block" data-left-block="type">
              <h4 class="sec-title">题型选择</h4>
              <div class="pill-group" id="typeGroup">
                <label class="pill"
                  ><input type="radio" name="qType" value="choice" checked /><span
                    >选择题</span
                  ></label
                >
                <label class="pill"
                  ><input type="radio" name="qType" value="multi_choice" /><span
                    >多选题</span
                  ></label
                >
                <label class="pill"
                  ><input type="radio" name="qType" value="judge" /><span>判断题</span></label
                >
                <label class="pill"
                  ><input type="radio" name="qType" value="fill" /><span>填空题</span></label
                >
                <label class="pill"
                  ><input type="radio" name="qType" value="programming" /><span>操作题</span></label
                >
                <label class="pill"
                  ><input type="radio" name="qType" value="scratch" /><span>Scratch 挑战</span></label
                >
              </div>
              <!-- 操作题细类：仅影响参考代码高亮与测试点展示，单表枚举字段。
                   `pill-sub` 让它在视觉上从属于上面的题型，而不是第二排平级选项。 -->
              <div class="pill-sub" id="langGroup" hidden>
                <span class="pill-sub-label">语言</span>
                <div class="pill-group">
                  <label class="pill"
                    ><input type="radio" name="qLang" value="cpp" checked /><span
                      >C++</span
                    ></label
                  >
                  <label class="pill"
                    ><input type="radio" name="qLang" value="python" /><span
                      >Python</span
                    ></label
                  >
                </div>
              </div>
              <!-- 题目形态：只对 Python 开放。算法题走 stdin/stdout 逐点判分，
                   作品题（画线/画气球）没有标准输入输出，判分靠声明式规则 + 教师量规。
                   C++ 没有对应的规则表，形态选择器对它整组隐藏。 -->
              <div class="pill-sub" id="shapeGroup" hidden>
                <span class="pill-sub-label">形态</span>
                <div class="pill-group">
                  <label class="pill"
                    ><input type="radio" name="qShape" value="algorithm" checked /><span
                      >算法题</span
                    ></label
                  >
                  <label class="pill"
                    ><input type="radio" name="qShape" value="project" /><span
                      >作品题（绘图）</span
                    ></label
                  >
                </div>
              </div>
            </div>

            <div class="left-block" data-left-block="knowledge">
              <h4 class="sec-title">知识点（可多选，点击弹出树形选择）</h4>
              <div
                class="kt-trigger"
                id="ktTrigger"
                title="点击选择知识点"
                role="button"
                tabindex="0"
                aria-haspopup="dialog"
                aria-expanded="false"
              >
                <span class="kt-hint" id="ktHint">＋ 选择知识点</span>
              </div>
            </div>

            <details class="more-settings left-taxonomy" id="taxonomyFold" data-left-block="taxonomy">
              <summary>
                分类与标签<span class="taxonomy-summary" id="taxonomySummary"></span>
              </summary>

              <div class="left-block">
                <h4 class="sec-title">难度（洛谷分级）</h4>
                <div class="pill-group" id="difficultyGroup"></div>
              </div>

              <div class="left-block">
                <h4 class="sec-title">题目来源</h4>
                <div class="pill-group">
                  <label class="pill"
                    ><input type="radio" name="qSource" value="第三方" checked /><span
                      >第三方</span
                    ></label
                  >
                  <label class="pill"
                    ><input type="radio" name="qSource" value="原创" /><span>原创</span></label
                  >
                  <label class="pill"
                    ><input type="radio" name="qSource" value="自命题" /><span>自命题</span></label
                  >
                  <label class="pill"
                    ><input type="radio" name="qSource" value="洛谷" /><span>洛谷</span></label
                  >
                  <label class="pill"
                    ><input type="radio" name="qSource" value="NOIP" /><span>NOIP</span></label
                  >
                  <label class="pill"
                    ><input type="radio" name="qSource" value="CSP-J" /><span>CSP-J</span></label
                  >
                  <label class="pill"
                    ><input type="radio" name="qSource" value="CSP-S" /><span>CSP-S</span></label
                  >
                  <label class="pill"
                    ><input type="radio" name="qSource" value="USACO" /><span>USACO</span></label
                  >
                </div>
              </div>

              <div class="left-block">
                <h4 class="sec-title">知识点结构</h4>
                <div class="pill-group">
                  <label class="pill"
                    ><input type="radio" name="qStructure" value="单项知识点" checked /><span
                      >单项知识点</span
                    ></label
                  >
                  <label class="pill"
                    ><input type="radio" name="qStructure" value="多项知识点" /><span
                      >多项知识点</span
                    ></label
                  >
                  <label class="pill"
                    ><input type="radio" name="qStructure" value="综合应用" /><span
                      >综合应用</span
                    ></label
                  >
                </div>
              </div>

              <div class="left-block">
                <h4 class="sec-title">适用阶段（可多选）</h4>
                <div class="multi-cloud" data-multi="stage">
                  <button class="tk" type="button" data-v="C++基础">C++基础</button>
                  <button class="tk" type="button" data-v="Python基础">Python基础</button>
                  <button class="tk" type="button" data-v="CSP-J">CSP-J</button>
                  <button class="tk" type="button" data-v="CSP-S">CSP-S</button>
                  <button class="tk" type="button" data-v="信奥提高">信奥提高</button>
                </div>
              </div>

              <div class="left-block">
                <h4 class="sec-title">业务标签（可多选）</h4>
                <div class="multi-cloud" data-multi="business">
                  <button class="tk" type="button" data-v="直播专用">直播专用</button>
                  <button class="tk" type="button" data-v="引流题">引流题</button>
                  <button class="tk" type="button" data-v="试机题">试机题</button>
                  <button class="tk" type="button" data-v="内部练习">内部练习</button>
                </div>
              </div>
            </details>

            <div class="left-block" data-left-block="owner">
              <h4 class="sec-title">当前负责人</h4>
              <p class="muted" id="ownerDisplay">正在读取当前登录用户…</p>
              <p class="form-error" id="rejectionDisplay" hidden></p>
            </div>
          </div>

          <!-- 右：由 formSchema 驱动的题型专属内容区（受控渲染） -->
          <div class="modal-right" id="formFields"></div>
        </div>

        <footer class="modal-foot">
          <span class="muted" id="readOnlyTip" hidden>当前题目不在可编辑状态，仅供查看。</span>
          <span class="spacer"></span>
          <button class="btn" id="previewProblemBtn" type="button">预览整题</button>
          <button class="btn" id="modalCancel" type="button">取消</button>
          <button class="btn" id="saveDraftBtn" type="button">保存草稿</button>
          <button class="btn primary" id="submitAuditBtn" type="button">提交审核</button>
        </footer>
      </section>
    </div>

    <div class="preview-mask" id="previewMask" hidden>
      <section class="preview-dialog" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
        <header class="preview-head">
          <h2 id="previewTitle">整题预览</h2>
          <button class="modal-close" id="previewClose" type="button" aria-label="关闭预览">×</button>
        </header>
        <div class="preview-body" id="previewBody"></div>
      </section>
    </div>

    <!-- 知识点 · 悬浮树选择器 -->
    <div class="kt-pop" id="ktPop" hidden>
      <input class="kt-filter" id="ktFilter" placeholder="搜索知识点…" />
      <ul class="kt-tree" id="ktTree"></ul>
      <div class="kt-summary" id="ktSummary">已选 <b>0</b> 项</div>
    </div>
    <script type="module" src="admin-api.js"></script>
    <script type="module" src="admin-layout.js"></script>
    <script type="module">
      import { initLayout } from "./admin-layout.js";
      import { adminDownload, adminMe, adminRequest, adminUpload, ifMatch } from "./admin-api.js";
      import { clearFieldErrors, closeMask, confirmDialog, escapeHtml, openMask, promptDialog, showFieldErrors, toast, trapFocus } from "./admin-ui.js";
        import { mountRubricEditor, mountRuleEditor } from "./admin-rule-editor.js";
      import { createPagedList } from "./admin-list.js";
      import { createKnowledgeTree } from "./admin-tagtree.js";
      import { IMAGE_WIDTHS, renderMarkdown, rewriteImageWidth, sanitizeRenderedHtml, splitImageAlt } from "./admin-markdown.js";
      import { scratchMockEnabled, scratchRequest } from "./admin-scratch-api.js";
      import { EXTENSION_OPTIONS, RULE_TYPES, buildChallengePayload, publishChecks, ruleToForm, ruleTypeHelp, ruleTypeLabel, studioDemoUrl, studioStarterUrl, DEFAULT_RUBRIC, rubricPayload } from "./admin-scratch-core.js";
        import { DEFAULT_PROJECT_RUBRIC, PY_MODULE_OPTIONS, PY_RULE_TYPES, projectAssetsPayload, projectSubmitChecks, pyRuleTypeHelp, pyRuleTypeLabel } from "./admin-python-core.js";
        import { taxonomyIsPristine, taxonomySummaryText } from "./admin-authoring-core.js";
      import { Uppy, Dashboard, AwsS3 } from "./vendor/uppy/uppy.esm.js";
      initLayout();

      // =====================================================================
      // 一、formSchema：配置驱动，不为每个题型写独立组件树
      // 字段渲染器挂在 RENDERERS 上，TYPE_SCHEMA 声明每个题型展示哪些字段。
      // 通用字段（stem/analysis）所有题型共用；通用标签（左栏）与题型无关，
      // 切换 type 时保留，只清空题型专属字段。
      // =====================================================================
      const TYPE_SCHEMA = {
        choice: { label: "选择题", fields: ["stem", "options", "analysis", "analysisVideo"] },
        multi_choice: { label: "多选题", fields: ["stem", "options", "analysis", "analysisVideo"] },
        judge: { label: "判断题", fields: ["stem", "judgeAnswer", "analysis", "analysisVideo"] },
        fill: { label: "填空题", fields: ["stem", "fillBlanks", "analysis", "analysisVideo"] },
        programming: { label: "操作题", fields: ["stem", "programming", "analysis", "analysisVideo"] },
        scratch: { label: "Scratch 挑战", fields: ["scratch"] },
      };

      // =====================================================================
      // 二、表单状态（受控）：数据提升到页面，Modal 只负责展示与触发回调
      // =====================================================================
      function emptyForm() {
        return {
          type: "choice",
          status: "draft",
          revision: null,
          owner: currentAdmin,
          allowedActions: ["edit", "submit", "delete"],
          rejection: null,
          subType: "cpp", // 仅操作题有值；单表枚举字段，不拆表
          common: {
            difficulty: "入门",
            source: "第三方",
            structure: "单项知识点",
            knowledge: [],
            stage: [],
            business: [],
          },
          stem: "",
          analysis: "",
          // 解析视频：大加号上传绑定（不筛选视频库）。uploadedVideoId 是本会话刚上传
          // 还未保存到题目的 video_id（可彻底删除）；analysisVideoId 是保存进题目的绑定值。
          analysisVideoId: null,
          hasAnalysisVideo: false,
          analysisVideoStatus: null,
          uploadedVideoId: null,
          uploadedVideoStatus: null,
          // 客观题默认 A-D；单选固定四项，多选可在此基础上继续添加。
          options: Array.from({ length: 4 }, () => ({ content: "", correct: false })),
          judgeAnswer: "正确",
          fillBlanks: [], // [{ blank_index, blank_key, answer }]，由 \placeholder[key]{} 的 key 自动生成
          programming: {
            title: "",
            passCondition: "编译通过",
            inputFormat: "",
            outputFormat: "",
            hints: "无",
            timeLimitMs: 1000,
            memoryLimitMb: 256,
            samples: [], // [{ input, output, is_sample: true }]
            refCode: { cpp: "", python: "" }, // 纯文本 + language（key）
            manualTestCases: [], // Python 手工隐藏测试点
            testDataPackage: null, // C++ ZIP 导入清单；文件内容仅留在服务端
            // ---- 仅作品题（shape="project"）----
            shape: "algorithm",
            starterCode: "", // 学生打开编辑器时预置的代码骨架
            allowedModules: [], // 允许 import 的顶层模块名；空 = 不限制
            rules: [], // 表单态 {type, params}，提交前由 projectAssetsPayload 扁平化
            rubric: null, // null = 不用量规；{ criteria: [...] } = 用量规
          },
          scratch: {
            id: null, version: null, edit_seq: null, status: "draft", title: "", instructions_md: "",
            allowed_extensions: [], hints_text: "", rules: [], has_starter: false,
            has_demo: false,             analysis_video_id: null, has_analysis_video: false,
            analysis_video_status: null,
            reviewed_by: null, reviewed_at: null, rejection: null,
            starter_size_bytes: 0, bound_block_count: 0, submission_count: 0,
            // 下载地址由后端下发（_serialize），前端不拼路径；无文件时为 null。
            starter_url: null, demo_url: null,
            rubric: null, // null = 不用量规；{ criteria: [...] } = 用量规
          },
        };
      }

      let formState = null; // 当前表单数据（父级持有）
      let initialSnapshot = null; // 打开时的快照，用于取消时 dirty 判断
      let currentAdmin = null;
      let modalReadOnly = false;
      let releaseModalFocus = null; // Modal 打开期间的 Tab 循环解绑函数
      let saving = false; // 保存/提交进行中：阻止重复提交
      // 新增 C++ 题在未取得题目 ID 前暂存于浏览器内存；保存草稿成功后自动上传。
      let pendingCppZipFile = null;

      // 编辑器实例登记：重渲染时销毁实例，避免保留失效节点和事件。
      let markdownInstances = [];
      let cmInstances = [];
      let redrawFillBlanks = null;
      let stemMarkdownEditor = null;

      // 插图按钮的图标。Vditor 内置 upload 项用的是一朵云 + 「上传图片或文件」，
      // 在这里是误导——录题人要的是"插图"，不是"上传文件"。
      const IMAGE_ICON_SVG =
        '<svg viewBox="0 0 1024 1024" width="16" height="16"><path fill="currentColor" d="M896 128H128a64 64 0 0 0-64 64v640a64 64 0 0 0 64 64h768a64 64 0 0 0 64-64V192a64 64 0 0 0-64-64zm0 704H128V192h768v640zM352 448a64 64 0 1 0 0-128 64 64 0 0 0 0 128zm448 256L608 448 448 640l-96-96-160 160h608z"/></svg>';

      const MARKDOWN_TOOLBAR = [
        "headings",
        "bold",
        "italic",
        "strike",
        "inline-code",
        "code",
        "table",
        "list",
        "ordered-list",
        "quote",
        "link",
        // 插图紧挨 link：两个都是"往正文里插入外部东西"，放一起找得到。
        { name: "upload", tip: "插入图片", icon: IMAGE_ICON_SVG },
        "undo",
        "redo",
        "fullscreen",
        "edit-mode",
      ];

      // 渲染（预览 + IR 即时渲染）时的空位标记与净化管线已抽到 admin-markdown.js（单源），
      // ___ / {{blank}} / \placeholder[key]{} 统一转为 .blank-mark；跳过 <pre>/<code>。

      /**
       * 插图：走 adminUpload() 而不是 Vditor 自带的 upload.url。
       *
       * 理由是会话。adminUpload 里已经有 CSRF 令牌轮换重试和 401 自动 refresh 后重试，
       * Vditor 的内置 XHR 两样都没有——会话一过期，录题人点插图拿到的是一句 Vditor 的
       * 英文报错，而页面其它部分还好好的，查起来很费劲。
       *
       * handler 模式下 Vditor 不会自己往正文里插，必须显式 insertValue。
       * 返回 null = 成功，返回字符串 = 失败（Vditor 会把它显示出来）。
       */
      async function uploadInlineImage(editor, files) {
        const file = (files || [])[0];
        if (!file) return null;
        try {
          const form = new FormData();
          form.append("file", file);
          const asset = await adminUpload("/media/images", form);
          // alt 留空：它会原样进 markdownToText 之外的地方（整卷预览的纯文本摘要），
          // 填个无意义的 "image" 是污染。要无障碍文本的自己在方括号里补。
          editor.insertValue(`![](${asset.url})`);
          return null;
        } catch (error) {
          const message = error?.message || "图片上传失败。";
          toast(message, "error");
          return message;
        }
      }

      // ==================== 题干配图的尺寸档位 ====================
      // IMAGE_WIDTHS / rewriteImageWidth 在 admin-markdown.js（渲染与源码改写的单源），
      // 那边有对应的护栏测试；这里只负责交互。
      let imageSizePopover = null;

      function closeImageSizePopover() {
        imageSizePopover?.remove();
        imageSizePopover = null;
      }
      document.addEventListener("click", (event) => {
        if (imageSizePopover && !imageSizePopover.contains(event.target)) closeImageSizePopover();
      });

      function openImageSizePopover(image, editor, onChange) {
        closeImageSizePopover();
        const src = image.getAttribute("src") || "";
        if (!src.startsWith("/media/")) return;   // 外链图不归我们管，也改不动
        // 当前档位从 alt 后缀读，不是 width 属性：IR 编辑区里的 <img> 是 lute 直接渲染的，
        // 没走渲染出口那道 alt→width 的钩子，width 属性在这里永远是空的。
        const current = splitImageAlt(image.getAttribute("alt") || "").width;
        const popover = document.createElement("div");
        popover.className = "image-size-pop";
        popover.innerHTML =
          `<span class="image-size-title">图片尺寸</span>` +
          IMAGE_WIDTHS.map(
            (item) =>
              `<button type="button" data-width="${item.value}"${item.value === current ? ' class="is-active"' : ""}>${item.label}</button>`,
          ).join("");
        const rect = image.getBoundingClientRect();
        popover.style.top = `${window.scrollY + rect.bottom + 6}px`;
        popover.style.left = `${window.scrollX + rect.left}px`;
        popover.addEventListener("click", (event) => {
          const button = event.target.closest("button[data-width]");
          if (!button) return;
          const next = rewriteImageWidth(editor.getValue(), src, button.dataset.width);
          // setValue 不会触发 input 回调，必须手动同步 formState，否则改了尺寸
          // 却不算"脏"，关 Modal 时不提示、保存时也存不进去。
          editor.setValue(next);
          onChange(next);
          closeImageSizePopover();
        });
        document.body.appendChild(popover);
        imageSizePopover = popover;
      }

      function mountMarkdownEditor(container, initialMarkdown, onChange, placeholder = "输入 Markdown 内容…", onBlur = null) {
        if (!window.Vditor) throw new Error("Vditor 未加载，请检查本地 vendor 资源。");
        const readOnly = modalReadOnly;
        const options = {
          value: initialMarkdown || "",
          mode: "ir",
          height: 220,
          cdn: "/admin/vendor/vditor",
          placeholder,
          cache: { enable: false },
          toolbar: MARKDOWN_TOOLBAR,
          // accept 只管住文件选择框，真正的类型校验在服务端（只信 Pillow 解码结果）。
          // handler 一接管，点按钮、粘贴截图、拖文件进来三条路径就都走它了。
          upload: {
            accept: "image/png,image/jpeg,image/gif,image/webp",
            multiple: false,
            handler: (files) => uploadInlineImage(editor, files),
          },
          preview: { transform: sanitizeRenderedHtml },
          input: (value) => onChange(value),
          // Vditor 的 toolbar 在 after 之前尚未创建；此时调用 disabled/enable 会直接抛错。
          after: () => {
            if (readOnly) editor.disabled();
          },
        };
        if (onBlur) options.blur = () => onBlur(editor);
        const editor = new window.Vditor(container, options);
        // 点正文里的图片 → 弹尺寸档位。事件挂在容器上做委托，不去碰 Vditor 内部的
        // contenteditable 节点：那些节点每次重渲染都会换，直接绑事件迟早绑到失效节点上。
        if (!readOnly) {
          container.addEventListener("click", (event) => {
            const image = event.target.closest?.("img");
            if (!image) return;
            event.preventDefault();
            event.stopPropagation();   // 否则 document 上那个"点外面就关"会立刻把它关掉
            openImageSizePopover(image, editor, onChange);
          });
        }
        return editor;
      }

      // ==================== 参考代码试跑 ====================
      // 用题目自己的参考代码跑一遍自己的测试数据。在这之前没有任何一步会去编译参考代码，
      // 一份粘贴时丢了半行的 C++ 可以一路通过审核、进卷、发给学员。
      let dryRunPolling = null;   // 轮询定时器，关 Modal 时必须清掉

      function stopDryRunPolling() {
        if (dryRunPolling) clearTimeout(dryRunPolling);
        dryRunPolling = null;
      }

      function buildDryRunControls() {
        const wrap = document.createElement("div");
        wrap.style.cssText = "margin-left:auto;display:flex;align-items:center;gap:8px";
        wrap.innerHTML = `
          <select id="dryRunScope" class="mini-select" aria-label="试跑范围">
            <option value="all">全部测试点</option>
            <option value="samples">仅样例</option>
          </select>
          <button type="button" class="btn" id="dryRunBtn">试跑</button>`;
        wrap.querySelector("#dryRunBtn").addEventListener("click", startDryRun);
        return wrap;
      }

      function buildDryRunPanel() {
        const panel = document.createElement("div");
        panel.id = "dryRunPanel";
        panel.className = "dry-run-panel";
        panel.hidden = true;
        return panel;
      }

      function dryRunPanel() {
        return document.getElementById("dryRunPanel");
      }

      function setDryRunBusy(busy, label = "试跑中…") {
        const button = document.getElementById("dryRunBtn");
        if (!button) return;
        button.disabled = busy;
        button.textContent = busy ? label : "试跑";
      }

      async function startDryRun() {
        // 试跑读的是库里的 reference_solutions，看不见编辑器里没保存的改动。不拦的话，
        // 录题人会对着"我明明改了怎么还报同样的错"怀疑人生。
        if (!editingId) {
          toast("请先保存草稿，再试跑参考代码。", "error");
          return;
        }
        if (isDirty()) {
          toast("有未保存的修改，请先保存草稿再试跑。", "error");
          return;
        }
        const scope = document.getElementById("dryRunScope")?.value || "all";
        setDryRunBusy(true, "排队中…");
        try {
          const queued = await adminRequest(`/problems/${editingId}/dry-run`, {
            method: "POST",
            body: JSON.stringify({ scope }),
          });
          renderDryRun({ ...queued, done: false });
          pollDryRun(queued.id, 250);
        } catch (error) {
          setDryRunBusy(false);
          toast(error.message, "error");
        }
      }

      function pollDryRun(dryRunId, delay) {
        stopDryRunPolling();
        dryRunPolling = setTimeout(async () => {
          try {
            const body = await adminRequest(`/dry-runs/${dryRunId}`);
            renderDryRun(body);
            if (body.done) {
              setDryRunBusy(false);
              return;
            }
            // 指数退避到 2s：判题通常一两秒出结果，但排队时不该每 250ms 打一次。
            pollDryRun(dryRunId, Math.min(delay * 1.6, 2000));
          } catch (error) {
            setDryRunBusy(false);
            toast(error.message, "error");
          }
        }, delay);
      }

      async function loadLatestDryRun() {
        if (!editingId) return;
        try {
          const body = await adminRequest(`/problems/${editingId}/dry-runs/latest`);
          if (!body.dry_run) return;
          // 试跑之后题目又改过的，结果不能当成"现在也通过"来显示。
          const stale = body.dry_run.problem_revision !== body.problem_revision;
          renderDryRun({ ...body.dry_run, stale });
          if (!body.dry_run.done) pollDryRun(body.dry_run.id, 500);
        } catch {
          // 打开题目时顺带拉一次，失败就不显示，不打扰录题
        }
      }

      const DRY_RUN_STATUS_TEXT = {
        accepted: "全部通过",
        wrong_answer: "答案错误",
        compile_error: "编译错误",
        runtime_error: "运行时错误",
        time_limit: "超出时间限制",
        memory_limit: "超出内存限制",
        judge_failed: "判题失败",
        queued: "排队中",
        judging: "判题中",
      };

      function renderDryRun(result) {
        const panel = dryRunPanel();
        if (!panel) return;
        panel.hidden = false;
        const label = DRY_RUN_STATUS_TEXT[result.status] || result.status;
        if (!result.done) {
          const queue = result.queue_position ? `（前面还有 ${result.queue_position} 个）` : "";
          panel.className = "dry-run-panel is-pending";
          panel.innerHTML = `<div class="dry-run-head">⏳ ${escapeHtml(label)}${escapeHtml(queue)}</div>`;
          return;
        }
        const passed = result.status === "accepted";
        panel.className = `dry-run-panel ${passed ? "is-pass" : "is-fail"}`;
        const cases = result.cases || [];
        const staleTip = result.stale
          ? '<div class="dry-run-stale">此结果对应旧版本，题目已改动，请重新试跑。</div>'
          : "";
        const summary = passed
          ? `✅ ${cases.length} 个测试点全部通过` +
            (result.time_ms != null ? `，用时 ${result.time_ms} ms / 内存 ${Math.round((result.memory_kb || 0) / 1024)} MB` : "")
          : `❌ ${escapeHtml(label)}`;

        // 编译错误没有逐点结果，给一条可复制的编译器原文即可。
        if (result.status === "compile_error" || result.status === "judge_failed" || !cases.length) {
          panel.innerHTML = `${staleTip}<div class="dry-run-head">${summary}</div>` +
            (result.compile_message
              ? `<pre class="dry-run-compile">${escapeHtml(result.compile_message)}</pre>`
              : "");
          return;
        }
        panel.innerHTML = `${staleTip}<div class="dry-run-head">${summary}</div>${renderDryRunCases(cases)}`;
      }

      function renderDryRunCases(cases) {
        const rows = cases
          .map((item) => {
            const name = item.case_no != null ? `#${item.case_no}` : `第 ${item.index + 1} 个`;
            const kind = item.is_sample ? "样例" : "隐藏";
            const mark = item.passed ? '<span class="ok">通过</span>' : `<span class="bad">${escapeHtml(DRY_RUN_STATUS_TEXT[item.status] || item.status)}</span>`;
            return `<tr><td>${escapeHtml(name)}</td><td>${kind}</td><td>${mark}</td>
              <td>${item.time_ms ?? "-"} ms</td>
              <td>${item.diff_line ? `第 ${item.diff_line} 行` : "-"}</td></tr>`;
          })
          .join("");
        // 首个失败的点自动展开 diff——录题人要的就是"差在哪"，不该再点一次。
        const failed = cases.find((item) => !item.passed);
        const diff = failed
          ? `<div class="dry-run-diff">
               <div class="dry-run-diff-title">第一个未通过的测试点${failed.case_no != null ? ` #${failed.case_no}` : ""}</div>
               <div class="dry-run-cols">
                 <div><h5>输入</h5><pre>${escapeHtml(failed.input || "")}</pre></div>
                 <div><h5>期望输出</h5><pre>${escapeHtml(failed.expected || "")}</pre></div>
                 <div><h5>实际输出</h5><pre>${escapeHtml(failed.actual || "")}</pre></div>
               </div>
             </div>`
          : "";
        return `<table class="dry-run-table"><thead><tr>
            <th>测试点</th><th>类型</th><th>结果</th><th>用时</th><th>首个差异</th>
          </tr></thead><tbody>${rows}</tbody></table>${diff}`;
      }

      // Python 作品题（shape="project"）的表单。
      //
      // 与算法题共用 `programming` 这一块，但字段几乎不重叠：作品题**没有标准输入输出**，
      // 所以输入/输出格式、样例、隐藏测试点、ZIP 导入整条链路都不出现；换上来的是
      // 初始代码、模块白名单、声明式规则和教师量规。
      //
      // 「效果图」不另开上传位：题干的 Markdown 编辑器已经支持插图，且配图是内容寻址的
      // （models.MediaAsset），同一张图被多道题引用也只存一份。再加一个专用上传口，
      // 等于为同一件事造第二套存储、第二条清理路径。
      //
      // 参考代码这里**没有试跑按钮**：试跑是拿参考代码去跑题目的测试数据，作品题没有
      // 测试数据可跑。等 AST 判定引擎落地后，这里换成「拿参考代码跑一遍判定规则」。
      function buildProjectForm(p) {
        const box = document.createElement("div");
        box.className = "card";
        box.style.cssText = "box-shadow:none;background:transparent;padding:0;margin-top:16px";

        const grid = document.createElement("div");
        grid.className = "form-grid";
        grid.innerHTML = `
        <label class="field">题目标题（≤ 20 字符）<input id="pTitle" maxlength="20" placeholder="如：画一个正六边形" /></label>
        <label class="field">通过条件
          <span class="pill-group">
            <label class="pill"><input type="radio" name="pPass" value="规则全通过" /><span>规则全通过</span></label>
            <label class="pill"><input type="radio" name="pPass" value="教师评定" /><span>教师评定</span></label>
          </span>
        </label>
        <label class="field">限时（ms，100–10000）<input id="pTimeLimit" type="number" min="100" max="10000" step="100" /></label>
        <label class="field">内存（MB，16–512）<input id="pMemoryLimit" type="number" min="16" max="512" /></label>
        <label class="field full">提示说明<textarea id="pHints" rows="2" placeholder="无"></textarea></label>`;
        grid.querySelector("#pTitle").value = p.title;
        grid.querySelectorAll('input[name="pPass"]').forEach((r) => {
          r.checked = r.value === p.passCondition;
          r.addEventListener("change", () => (p.passCondition = r.value));
        });
        grid.querySelector("#pTimeLimit").value = p.timeLimitMs ?? 1000;
        grid.querySelector("#pMemoryLimit").value = p.memoryLimitMb ?? 256;
        grid.querySelector("#pHints").value = p.hints;
        grid.querySelector("#pTitle").addEventListener("input", (e) => (p.title = e.target.value));
        grid.querySelector("#pHints").addEventListener("input", (e) => (p.hints = e.target.value));
        grid.querySelector("#pTimeLimit").addEventListener("input", (e) => {
          p.timeLimitMs = e.target.value === "" ? null : Number(e.target.value);
        });
        grid.querySelector("#pMemoryLimit").addEventListener("input", (e) => {
          p.memoryLimitMb = e.target.value === "" ? null : Number(e.target.value);
        });
        box.appendChild(grid);

        const note = document.createElement("p");
        note.className = "muted";
        note.style.cssText = "margin:10px 0 0";
        note.textContent = "画成什么样，请把效果图插进上面的题干里（Markdown 编辑器支持贴图）。限时与内存对绘图题仍然有用：学生写出死循环时靠它兜住。";
        box.appendChild(note);

        // ---- 初始代码 ----
        const starterTitle = document.createElement("h4");
        starterTitle.className = "sec-title";
        starterTitle.style.cssText = "margin:18px 0 4px";
        starterTitle.textContent = "初始代码（学生打开就有）";
        box.appendChild(starterTitle);
        const starterHint = document.createElement("p");
        starterHint.className = "muted";
        starterHint.style.cssText = "margin:0 0 6px";
        starterHint.textContent = "起手式：import 与注释写在这里，学生只需补上关键那几行。作品题没有输入格式可写，这一段就是题目的脚手架。";
        box.appendChild(starterHint);
        const starterArea = document.createElement("textarea");
        starterArea.className = "code-area";
        starterArea.id = "pStarterCode";
        starterArea.value = p.starterCode;
        box.appendChild(starterArea);
        cmInstances.push(mountCodeMirror(starterArea, "text/x-python", (v) => (p.starterCode = v)));

        // ---- 允许使用的模块 ----
        const moduleTitle = document.createElement("h4");
        moduleTitle.className = "sec-title";
        moduleTitle.style.cssText = "margin:18px 0 4px";
        moduleTitle.textContent = "允许使用的模块";
        box.appendChild(moduleTitle);
        const moduleHint = document.createElement("p");
        moduleHint.className = "muted";
        moduleHint.style.cssText = "margin:0 0 6px";
        moduleHint.textContent = "一个都不勾 = 不限制。勾了就是白名单，用于把学生圈在本课教过的工具里。";
        box.appendChild(moduleHint);
        const moduleGrid = document.createElement("div");
        moduleGrid.className = "check-grid";
        moduleGrid.innerHTML = PY_MODULE_OPTIONS.map((option) => `<label><input type="checkbox" value="${option.key}" ${p.allowedModules.includes(option.key) ? "checked" : ""} /> ${escapeHtml(option.label)}</label>`).join("");
        moduleGrid.addEventListener("change", () => {
          p.allowedModules = [...moduleGrid.querySelectorAll("input:checked")].map((i) => i.value);
        });
        box.appendChild(moduleGrid);

        // ---- 参考代码 ----
        const codeTitle = document.createElement("h4");
        codeTitle.className = "sec-title";
        codeTitle.style.cssText = "margin:18px 0 4px";
        codeTitle.textContent = "参考代码（Python）";
        box.appendChild(codeTitle);
        const codeArea = document.createElement("textarea");
        codeArea.className = "code-area";
        codeArea.id = "pRefCode";
        codeArea.value = p.refCode.python;
        box.appendChild(codeArea);
        cmInstances.push(mountCodeMirror(codeArea, "text/x-python", (v) => (p.refCode.python = v)));

        // ---- 判定规则 ----
        const rulesSection = document.createElement("section");
        rulesSection.className = "scratch-question-section";
        rulesSection.style.cssText = "margin-top:18px";
        rulesSection.innerHTML = `<h4>判定规则</h4>
          <p class="muted">服务端静态读一遍学生代码来判，不需要把程序跑起来。规则参数不会下发给学生，只下发规则名——参数里带着答案。</p>
          <ol class="scratch-rule-list" id="pyRules"></ol>
          <div class="inline-picker">
            <select id="pyRuleType">${PY_RULE_TYPES.map((type) => `<option value="${type.key}" title="${escapeHtml(type.desc)}">${escapeHtml(type.label)}</option>`).join("")}</select>
            <button class="btn" id="pyRuleAdd" type="button">添加规则（自动填入示例）</button>
          </div>
          <p class="muted scratch-rule-help" id="pyRuleHelp"></p>`;
        box.appendChild(rulesSection);

        // ---- 教师量规 ----
        const rubricSection = document.createElement("section");
        rubricSection.className = "scratch-question-section";
        rubricSection.style.cssText = "margin-top:18px";
        rubricSection.innerHTML = `<h4>教师量规（可选）</h4>
          <p class="muted">绘图作品好不好看，规则判不出来，得老师打分。批改台按量规逐项打分；不配置则只做通过 / 不通过。满分 = 各准则最高档分值之和，自动计算，不必手填。</p>
          <div class="inline-picker">
            <button class="btn" id="pyRubricDefault" type="button">使用推荐量规</button>
            <button class="btn" id="pyRubricClear" type="button">不用量规</button>
          </div>
          <div id="pyRubricArea"></div>`;
        box.appendChild(rubricSection);

        // ---- 自查清单 ----
        const readiness = document.createElement("aside");
        readiness.className = "scratch-inline-readiness";
        readiness.innerHTML = '<strong>提交前自查</strong><ul id="pyReadiness"></ul>';
        box.appendChild(readiness);
        const renderReadiness = () => {
          const missing = new Set(projectSubmitChecks(p));
          box.querySelector("#pyReadiness").innerHTML = ["初始代码", "至少一条判定规则，或一套教师量规"]
            .map((item) => `<li class="${missing.has(item) ? "missing" : "ready"}">${missing.has(item) ? "待补充" : "已完成"} · ${escapeHtml(item)}</li>`)
            .join("");
        };

        const ruleEditor = mountRuleEditor({
          list: box.querySelector("#pyRules"),
          typeSelect: box.querySelector("#pyRuleType"),
          addButton: box.querySelector("#pyRuleAdd"),
          help: box.querySelector("#pyRuleHelp"),
        }, {
          get: () => p.rules,
          ruleTypes: PY_RULE_TYPES,
          labelOf: pyRuleTypeLabel,
          helpOf: pyRuleTypeHelp,
          onChange: renderReadiness,
        });
        const rubricEditor = mountRubricEditor(box.querySelector("#pyRubricArea"), {
          get: () => p.rubric,
          set: (value) => { p.rubric = value; },
        });
        box.querySelector("#pyRubricDefault").addEventListener("click", () => {
          p.rubric = JSON.parse(JSON.stringify(DEFAULT_PROJECT_RUBRIC));
          rubricEditor.render(); renderReadiness();
        });
        box.querySelector("#pyRubricClear").addEventListener("click", () => {
          p.rubric = null;
          rubricEditor.render(); renderReadiness();
        });
        box.addEventListener("input", renderReadiness);

        ruleEditor.render(); rubricEditor.render(); renderReadiness();
        return box;
      }

      function mountCodeMirror(textarea, mode, onChange) {
        if (!window.CodeMirror) throw new Error("CodeMirror 未加载，请检查本地 vendor 资源。");
        const editor = window.CodeMirror.fromTextArea(textarea, {
          mode,
          lineNumbers: true,
          lineWrapping: false, // 参考代码保持原始排版：长行横向滚动，不自动折行
          indentUnit: 4,
          tabSize: 4,
          autofocus: false,
          extraKeys: { Tab: "indentMore", "Shift-Tab": "indentLess" },
        });
        editor.on("change", (instance) => onChange(instance.getValue()));
        return editor;
      }

      // CodeMirror 在挂载时测量行号栏宽度，并把它写成 .CodeMirror-sizer 的内联
      // margin-left；渲染器是先在游离节点里建好编辑器再 append 到 #formFields 的，
      // 挂载那一刻量不到宽度（得 0），代码就会顶在编辑框左边、被行号栏盖住。
      // 入文档、以及 Modal 的缩放动画结束后各刷新一次，让它重新测量。
      function refreshCodeEditors() {
        cmInstances.forEach((cm) => cm.refresh());
      }

      function cleanupEditors() {
        markdownInstances.forEach((editor) => {
          try {
            editor.destroy();
          } catch {}
        });
        cmInstances.forEach((cm) => cm.toTextArea());
        markdownInstances = [];
        cmInstances = [];
        redrawFillBlanks = null;
        stemMarkdownEditor = null;
        // 关 Modal 后轮询还在跑的话，它会对着已经不存在的面板 innerHTML，
        // 而且每次都白打一个请求直到判题结束。
        stopDryRunPolling();
        // 解析视频上传区：Uppy Dashboard 绑定在 #formFields 的节点上，重渲染前必须销毁
        destroyAnalysisVideoArea();
      }

      // subType 只影响语法高亮模式与 payload 枚举，不拆表不拆 schema
      function subTypeOf() {
        return formState.subType;
      }
      function codeModeFor(lang) {
        return lang === "python" ? "text/x-python" : "text/x-c++src";
      }
      function optionLabel(index) {
        return String.fromCharCode(65 + index);
      }

      function snapshot() {
        return JSON.stringify(formState);
      }
      function isDirty() {
        return formState && initialSnapshot !== null && snapshot() !== initialSnapshot;
      }

      // 打开 Modal：新增（null）或编辑（题目 id → 拉详情反填）
      async function openModal(target = null, initialType = null) {
        cleanupEditors();
        pendingCppZipFile = null;
        // 上一道题里手动收起过折叠区，不该带到这一道题上——每次开窗都重新按
        // "有没有非默认标签"来决定展开与否。
        delete document.getElementById("taxonomyFold").dataset.userToggled;
        if (target) {
          let data;
          try {
            data = await adminRequest(`/problems/${target}`);
          } catch (error) {
            toast(error.message || "题目详情加载失败。", "error");
            return;
          }
          formState = hydrate(data);
          modalReadOnly = !formState.allowedActions.includes("edit");
        } else {
          formState = emptyForm();
          if (initialType) formState.type = initialType;
          modalReadOnly = false;
        }
        initialSnapshot = snapshot();
        editingId = typeof target === "number" ? target : null;
        document.getElementById("modalTitle").textContent = editingId
          ? `${modalReadOnly ? "查看" : "编辑"}试题 #${editingId}`
          : formState.type === "scratch" ? "新增 Scratch 挑战" : "新增试题";
        syncLeftPanel();
        renderAll();
        // 打开动画期间 .modal 带着 scale(0.98)，此时量出的字符宽度会小 2%，
        // 光标会随行长逐渐偏移；等动画结束（缩放回 1）再测一次。
        const modalBox = mask.querySelector(".modal");
        modalBox.addEventListener("transitionend", refreshCodeEditors, { once: true });
        releaseModalFocus = openMask(mask);
        document.getElementById("modalClose").focus();
      }

      // Scratch 挑战不进普通 problems 表，但在「题库管理 → 草稿」里要和普通草稿
      // 一起可见。这里复用同一份录题 Modal，只从挑战 API 反填，避免伪造 Problem。
      async function openScratchChallenge(challengeId) {
        cleanupEditors();
        pendingCppZipFile = null;
        try {
          const loaded = await scratchRequest(`/scratch/challenges/${challengeId}`);
          formState = emptyForm();
          formState.type = "scratch";
          formState.scratch = {
            ...formState.scratch,
            ...loaded,
            hints_text: (loaded.hints || []).join("\n"),
            rules: (loaded.rules || []).map(ruleToForm),
          };
          modalReadOnly = loaded.status !== "draft";
          editingId = null;
          initialSnapshot = snapshot();
          document.getElementById("modalTitle").textContent = modalReadOnly
            ? `查看 Scratch 挑战 #${challengeId}`
            : `编辑 Scratch 挑战 #${challengeId}`;
          syncLeftPanel();
          renderAll();
          const modalBox = mask.querySelector(".modal");
          modalBox.addEventListener("transitionend", refreshCodeEditors, { once: true });
          releaseModalFocus = openMask(mask);
          document.getElementById("modalClose").focus();
        } catch (error) {
          toast(error.message || "Scratch 挑战加载失败。", "error");
        }
      }

      // 反填：后端 payload → formState（结构一一对应）
      function hydrate(data) {
        const form = emptyForm();
        form.type = data.type;
        form.status = data.status || "draft";
        form.revision = data.revision;
        form.owner = data.owner || currentAdmin;
        form.allowedActions = data.allowed_actions || ["view"];
        form.rejection = data.rejection || null;
        form.subType = data.sub_type || "cpp";
        form.stem = data.stem || "";
        form.analysis = data.analysis || "";
        form.analysisVideoId = data.analysis_video_id ?? null;
        form.hasAnalysisVideo = !!data.has_analysis_video;
        form.analysisVideoStatus = data.analysis_video_status ?? null;
        form.uploadedVideoId = null;
        form.uploadedVideoStatus = null;
        form.common.difficulty = data.common?.difficulty || "入门";
        form.common.source = data.common?.source || "第三方";
        form.common.structure = data.common?.structure || "单项知识点";
        form.common.knowledge = kt.normalize(data.common?.knowledge);
        form.common.stage = [...(data.common?.stage || [])];
        form.common.business = [...(data.common?.business || [])];
        form.options = (data.options || []).map((o) => ({
          content: o.content,
          correct: !!o.is_correct,
        }));
        const correct = (data.options || []).find((o) => o.is_correct);
        if (correct) form.judgeAnswer = correct.content === "错" ? "错误" : "正确";
        if (data.type === "fill") {
          const answersByKey = new Map(
            (data.blanks || []).map((blank) => [
              blank.blank_key,
              joinBlankAnswers(blank.answer, blank.alternatives),
            ]),
          );
          syncFillBlanksFor(form, answersByKey);
        }
        if (data.type === "programming" && data.programming) {
          const p = data.programming;
          form.programming.title = p.title || "";
          form.programming.passCondition = p.pass_condition || "编译通过";
          form.programming.inputFormat = p.input_format || "";
          form.programming.outputFormat = p.output_format || "";
          form.programming.hints = p.hints || "无";
          form.programming.timeLimitMs = p.time_limit_ms ?? 1000;
          form.programming.memoryLimitMb = p.memory_limit_mb ?? 256;
          form.programming.samples = (p.samples || []).map((s) => ({
            input: s.input,
            output: s.output,
            is_sample: true,
          }));
          form.programming.refCode = {
            cpp: p.ref_code?.cpp || "",
            python: p.ref_code?.python || "",
          };
          form.programming.manualTestCases = (p.manual_test_cases || []).map((t) => ({
            input: t.input,
            output: t.output,
            timeLimitMs: t.time_limit_ms ?? null,
            memoryLimitMb: t.memory_limit_mb ?? null,
          }));
          form.programming.testDataPackage = p.testdata_package || null;
          form.programming.shape = p.shape === "project" ? "project" : "algorithm";
          form.programming.starterCode = p.starter_code || "";
          form.programming.allowedModules = Array.isArray(p.allowed_modules) ? [...p.allowed_modules] : [];
          form.programming.rules = (p.rules || []).map(ruleToForm);
          // 后端用 {} 表示"不用量规"，表单态用 null——同一个含义两种写法是历史，
          // 在这一处归一，别让下游每个判断都写 `!rubric || !rubric.criteria?.length`。
          form.programming.rubric = p.rubric?.criteria?.length ? p.rubric : null;
        }
        return form;
      }

      function closeModal() {
        kt.close();
        cleanupEditors();
        closeMask(mask, releaseModalFocus);
        releaseModalFocus = null;
        formState = null;
        initialSnapshot = null;
        editingId = null;
        pendingCppZipFile = null;
        modalReadOnly = false;
      }

      // 三个关闭入口统一走 handleClose：dirty 判断只写一处
      let closeConfirmOpen = false;
      async function handleClose() {
        if (!mask.classList.contains("show") || closeConfirmOpen) return;
        if (saving) {
          toast("正在保存，请稍候。", "info");
          return;
        }
        if (isDirty()) {
          closeConfirmOpen = true;
          const discard = await confirmDialog({
            title: "放弃未保存的改动？",
            message: "当前录入内容尚未保存，关闭后将会丢失。",
            confirmText: "放弃并关闭",
            danger: true,
          });
          closeConfirmOpen = false;
          if (!discard) return;
        }
        closeModal();
      }

      // 左栏（通用标签）状态回写，切换 type 不清空
      // 折叠区的两条判据（要不要自动展开、标题上显示什么）在 admin-authoring-core.js，
      // 那里能被 vitest 直接测到；这里只负责把结果写进 DOM。
      //
      // 用户手动收起后不再强行展开（`dataset.userToggled`），不然点一下就弹回来。
      function syncTaxonomyFold() {
        const fold = document.getElementById("taxonomyFold");
        document.getElementById("taxonomySummary").textContent =
          taxonomySummaryText(formState.common);
        if (!fold.dataset.userToggled) fold.open = !taxonomyIsPristine(formState.common);
      }

      function syncLeftPanel() {
        kt.setSelected(formState.common.knowledge); // 归一化并回写 chips/摘要
        const setRadio = (name, value) => {
          const input = document.querySelector(`input[name="${name}"][value="${value}"]`);
          if (input) input.checked = true;
        };
        setRadio("qType", formState.type);
        setRadio("qLang", formState.subType);
        setRadio("qShape", formState.programming.shape);
        setRadio("qDifficulty", formState.common.difficulty);
        setRadio("qSource", formState.common.source);
        setRadio("qStructure", formState.common.structure);
        document.querySelectorAll(".multi-cloud").forEach((cloud) => {
          const key = cloud.dataset.multi;
          cloud
            .querySelectorAll(".tk")
            .forEach((tk) =>
              tk.classList.toggle("active", formState.common[key].includes(tk.dataset.v)),
            );
        });
        // 子级选择器逐层出现：选了操作题才问语言，选了 Python 才问形态。
        document.getElementById("langGroup").hidden = formState.type !== "programming";
        document.getElementById("shapeGroup").hidden =
          !(formState.type === "programming" && formState.subType === "python");
        // Scratch 挑战的题面、规则、量规全在右栏自己的渲染器里，左栏除题型外都不适用。
        // **按 data-left-block 判断，不要按 index**：块的顺序一变，"index > 0 就隐藏"
        // 会静默地藏错东西，而这种错不会报任何错。
        document.querySelectorAll(".modal-left [data-left-block]").forEach((block) => {
          block.hidden = formState.type === "scratch" && block.dataset.leftBlock !== "type";
        });
        syncTaxonomyFold();
        document.getElementById("ownerDisplay").textContent = formState.owner?.display_name || "未分配负责人";
        const rejectionDisplay = document.getElementById("rejectionDisplay");
        rejectionDisplay.hidden = !formState.rejection?.reason;
        rejectionDisplay.textContent = formState.rejection?.reason
          ? `最近打回：${formState.rejection.reason}`
          : "";
        kt.refresh(); // 知识点 chips 与树勾选状态回写
      }

      // =====================================================================
      // 三、受控渲染：右栏字段由 schema 驱动，输入事件回写 formState
      // =====================================================================
      const formFields = document.getElementById("formFields");

      function renderAll() {
        if (!formState) return;
        cleanupEditors();
        syncLeftPanel();
        formFields.innerHTML = "";
        for (const field of TYPE_SCHEMA[formState.type].fields) {
          formFields.appendChild(RENDERERS[field]());
        }
        refreshCodeEditors();
        applyModalAccess();
      }

      const ACCESS_CONTROLLED =
        ".modal-left input, .modal-left button, #formFields input, #formFields textarea, #formFields select, #formFields button, #formFields [contenteditable=\"true\"]";

      function applyModalAccess() {
        const saveDraft = document.getElementById("saveDraftBtn");
        const submitAudit = document.getElementById("submitAuditBtn");
        const scratchMode = formState.type === "scratch";
        saveDraft.textContent = scratchMode ? "保存挑战草稿" : "保存草稿";
        submitAudit.textContent = scratchMode ? "发布挑战" : "提交审核";
        document.getElementById("previewProblemBtn").hidden = scratchMode;
        saveDraft.hidden = modalReadOnly;
        submitAudit.hidden = modalReadOnly;
        document.getElementById("readOnlyTip").hidden = !modalReadOnly;
        // 左栏是静态 DOM，不随 renderAll 重建：必须显式复位，
        // 否则查看一次只读题目后，再打开可编辑题目左栏仍然是禁用的。
        document.querySelectorAll(ACCESS_CONTROLLED).forEach((element) => {
          // data-read-action 的控件不受只读约束：这一层管的是"能不能改"，
          // 而下载是读动作——能打开这道题就该能把测试数据拿走，和能不能编辑无关。
          // 它们各自的 disabled 由业务状态决定（比如清单为空时不给下载），
          // 在这里一刀切会把那个状态覆盖掉。
          if (element.hasAttribute("data-read-action")) return;
          element.disabled = modalReadOnly;
        });
        document.getElementById("ktTrigger").classList.toggle("is-disabled", modalReadOnly);
        cmInstances.forEach((editor) => editor.setOption("readOnly", modalReadOnly));
      }

      const RENDERERS = {
        scratch() {
          const s = formState.scratch;
          const box = document.createElement("div");
          box.className = "scratch-question-editor";
          box.innerHTML = `
            <div class="scratch-question-head"><div><h3>Scratch 图形化编程挑战</h3><p>沿用题库录入工作区；挑战独立保存，不进入普通试卷题目表。</p></div><span class="node-badge ${s.status === "published" ? "trial" : "warn"}">${s.status === "published" ? "已发布" : "草稿"}</span></div>
            ${s.rejection?.reason ? `<div class="scratch-rejection" role="alert"><strong>最近打回：</strong>${escapeHtml(s.rejection.reason)}</div>` : ""}
            <div class="inline-picker scratch-existing-picker"><select id="scratchExisting"><option value="">加载已有挑战草稿…</option></select><button class="btn" id="scratchLoad" type="button">加载</button>${s.status === "published" ? '<button class="btn" id="scratchDuplicate" data-read-action type="button">复制为新版本</button>' : ""}</div>
            <div class="form-field"><label>挑战标题 <b class="req">*</b></label><input id="scratchTitle" maxlength="200" value="${escapeHtml(s.title)}" placeholder="如：绿旗动一动" /></div>
            <div class="form-field"><label>任务说明 <b class="req">*</b></label><textarea id="scratchInstructions" rows="6" placeholder="学生在 Scratch Studio 中看到的任务说明">${escapeHtml(s.instructions_md)}</textarea></div>
            <section class="scratch-question-section"><h4>初始项目 <b class="req">*</b></h4><p class="muted">学生进入 Studio 时加载；可直接在 Studio 中制作，完成后存回本关。</p><div class="scratch-upload-row"><strong id="scratchStarterState">${s.has_starter ? `已上传 · ${Math.ceil((s.starter_size_bytes || 0) / 1024)} KB` : "未上传"}</strong><span class="scratch-upload-actions">${s.id ? `<a class="btn" href="${studioStarterUrl(s.id)}" target="_blank" rel="noopener">${s.has_starter ? "在 Studio 中编辑" : "在 Studio 中录制"}</a>` : `<button class="btn" id="scratchSaveAndEdit" type="button">保存草稿并在 Studio 中编辑</button>`}${s.starter_url ? `<a class="btn" href="${s.starter_url}" download>下载 .sb3</a>` : `<button class="btn" type="button" disabled title="还没有初始项目">下载 .sb3</button>`}<button class="btn" id="scratchStarterPick" type="button" ${s.id ? "" : "disabled"}>上传或替换 .sb3</button></span><input id="scratchStarterFile" type="file" accept=".sb3" hidden /></div></section>
            <section class="scratch-question-section"><h4>判定规则 <b class="req">*</b></h4><ol class="scratch-rule-list" id="scratchRules"></ol><div class="inline-picker"><select id="scratchRuleType">${RULE_TYPES.map((type) => `<option value="${type.key}" title="${escapeHtml(type.desc)}">${type.label}</option>`).join("")}</select><button class="btn" id="scratchRuleAdd" type="button">添加规则（自动填入示例）</button></div><p class="muted scratch-rule-help" id="scratchRuleHelp"></p></section>
            <section class="scratch-question-section"><h4>教师量规（可选）</h4><p class="muted">批改台按量规逐项打分；不配置则只做通过 / 不通过。满分 = 各准则最高档分值之和，自动计算，不必手填。</p><div class="inline-picker"><button class="btn" id="scratchRubricDefault" type="button">使用推荐量规</button><button class="btn" id="scratchRubricClear" type="button">不用量规</button><select id="scratchRubricImport"><option value="">从其它挑战导入量规…</option></select><button class="btn" id="scratchRubricImportBtn" type="button">导入</button></div><div id="scratchRubricArea"></div></section>
            <section class="scratch-question-section"><h4>提示与扩展</h4><div class="form-field"><label>提示（每行一条）</label><textarea id="scratchHints" rows="3">${escapeHtml(s.hints_text)}</textarea></div><div class="check-grid" id="scratchExtensions">${EXTENSION_OPTIONS.map((option) => `<label><input type="checkbox" value="${option.key}" ${s.allowed_extensions.includes(option.key) ? "checked" : ""} /> ${option.label}</label>`).join("")}</div></section>
            <section class="scratch-question-section"><h4>示范项目</h4><p class="muted">与初始项目一样在 Studio 里录制。学生<strong>提交作品并拿到结果后</strong>可在只读 Studio 中查看，提交前既看不到入口也取不到文件。</p><div class="scratch-upload-row"><strong id="scratchDemoState">${s.has_demo ? "已上传" : "未上传"}</strong><span class="scratch-upload-actions">${s.id ? `<a class="btn" href="${studioDemoUrl(s.id)}" target="_blank" rel="noopener">${s.has_demo ? "在 Studio 中编辑示范项目" : "在 Studio 中录制示范项目"}</a>` : `<button class="btn" type="button" disabled title="请先保存挑战草稿">在 Studio 中录制示范项目</button>`}${s.demo_url ? `<a class="btn" href="${s.demo_url}" download>下载 .sb3</a>` : `<button class="btn" type="button" disabled title="还没有示范项目">下载 .sb3</button>`}<button class="btn" id="scratchDemoPick" type="button" ${s.id ? "" : "disabled"}>上传或替换 .sb3</button></span><input id="scratchDemoFile" type="file" accept=".sb3" hidden /></div>${s.status === "published" ? '<p class="muted">已发布的挑战不能原地改示范项目，请先复制为新版本。</p>' : ""}</section>
            <section class="scratch-question-section"><h4>教师解析视频</h4><p class="muted">可选。大加号点击或拖拽上传；学生提交作品并拿到结果后才可播放，避免提前泄题。</p><div class="av-area" data-scratch-av-mount></div></section>
            <aside class="scratch-inline-readiness"><strong>发布就绪度</strong><ul id="scratchReadiness"></ul><span class="muted">版本 ${s.version ? `v${s.version}` : "未保存"} · 已绑定 ${s.bound_block_count || 0} 个内容块 · ${s.submission_count || 0} 条提交</span></aside>`;
          // 规则编辑器实现在 mountRuleEditor，与 Python 作品题共用同一份。
          const ruleEditor = mountRuleEditor({
            list: box.querySelector("#scratchRules"),
            typeSelect: box.querySelector("#scratchRuleType"),
            addButton: box.querySelector("#scratchRuleAdd"),
            help: box.querySelector("#scratchRuleHelp"),
          }, {
            get: () => s.rules,
            ruleTypes: RULE_TYPES,
            labelOf: ruleTypeLabel,
            helpOf: ruleTypeHelp,
            onChange: () => renderReadiness(),
          });
          const renderRules = () => ruleEditor.render();
          const renderReadiness = () => {
            const payload = scratchPayload();
            const missing = new Set(publishChecks({ ...s, ...payload }));
            box.querySelector("#scratchReadiness").innerHTML = ["挑战标题", "任务说明", "初始项目（.sb3）", "至少一条声明式规则"].map((item) => `<li class="${missing.has(item) ? "missing" : "ready"}">${missing.has(item) ? "待补充" : "已完成"} · ${item}</li>`).join("");
          };
          const sync = () => {
            s.title = box.querySelector("#scratchTitle").value;
            s.instructions_md = box.querySelector("#scratchInstructions").value;
            s.hints_text = box.querySelector("#scratchHints").value;
            s.allowed_extensions = [...box.querySelectorAll("#scratchExtensions input:checked")].map((input) => input.value);
            renderReadiness();
          };
          const loadExisting = async () => {
            const selected = Number(box.querySelector("#scratchExisting").value);
            if (!selected) return;
            try {
              const loaded = await scratchRequest(`/scratch/challenges/${selected}`);
              formState.scratch = { ...formState.scratch, ...loaded, hints_text: (loaded.hints || []).join("\n"), rules: (loaded.rules || []).map(ruleToForm) };
              formState.uploadedVideoId = null;
              formState.uploadedVideoStatus = null;
              modalReadOnly = loaded.status === "published";
              initialSnapshot = snapshot(); renderAll();
            } catch (error) { toast(error.message, "error"); }
          };
          box.querySelector("#scratchLoad").addEventListener("click", loadExisting);
          box.querySelector("#scratchDuplicate")?.addEventListener("click", async () => {
            try {
              const copied = await scratchRequest(`/scratch/challenges/${s.id}/duplicate`, { method: "POST", body: "{}" });
              formState.scratch = { ...formState.scratch, ...copied, hints_text: (copied.hints || []).join("\n"), rules: (copied.rules || []).map(ruleToForm) };
              formState.uploadedVideoId = null;

          syncFillBlanks();
          const wrap = box.querySelector("#fillWrap");

          function draw() {
            // 重复空位标识即时提示（提交审核时后端也会拒绝）。
            const counts = {};
            formState.fillBlanks.forEach((blank) => (counts[blank.blank_key] = (counts[blank.blank_key] || 0) + 1));
            const dups = Object.entries(counts).filter(([, count]) => count > 1);
            warn.hidden = dups.length === 0;
            warn.textContent = dups.length
              ? `⚠ 空位标识重复：${dups.map(([key, count]) => `${key}（出现 ${count} 次）`).join("、")}，提交审核会被拒绝，请修改题干。`
              : "";
            wrap.innerHTML = "";
            formState.fillBlanks.forEach((blank, i) => {
              const div = document.createElement("div");
              div.className = "row-select";
              div.innerHTML = `<span class="blank-tag">空 ${i + 1}</span><small class="muted">${blank.blank_key}</small>
            <input class="blank-answer" placeholder="标准答案；多种写法用 | 分隔，如 0.5 | 1/2（答案本身含竖线时写成 \\|）" style="flex:1" />`;
              div.querySelector(".blank-answer").value = blank.answer;
              div
                .querySelector(".blank-answer")
                .addEventListener("input", (e) => (blank.answer = e.target.value));

          redrawFillBlanks = draw;

            formState.stem = stemMarkdownEditor.getValue();
            // 与自动识别保持一致：光标处于代码围栏内时不允许插入，回滚并提示。
            const marker = `\\placeholder[${blankKey}]{}`;

            if (markerIndex >= 0) {
              const openFences = (formState.stem.slice(0, markerIndex).match(/^\s*(`{3,}|~{3,})/gm) || []).length;

                stemMarkdownEditor.setValue(formState.stem);

                return;

            }
            syncFillBlanks();
            draw();
            stemMarkdownEditor.focus();
          });
          draw();
          return box;
        },
