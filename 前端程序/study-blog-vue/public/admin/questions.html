      function validateLimits() {
        const errors = [];
        if (formState.type !== "programming") return errors;
        const p = formState.programming;
        const bad = (value, lo, hi) => value != null && !(Number.isInteger(value) && value >= lo && value <= hi);
        if (bad(p.timeLimitMs, 100, 10000)) errors.push({ selector: "#pTimeLimit", message: "限时需在 100–10000 ms 之间。" });
        if (bad(p.memoryLimitMb, 16, 512)) errors.push({ selector: "#pMemoryLimit", message: "内存需在 16–512 MB 之间。" });
        if (p.manualTestCases.some((item) => bad(item.timeLimitMs, 100, 10000)))
          errors.push({ selector: ".tc-time", message: "测试点限时需在 100–10000 ms 之间，留空表示继承题目级。" });
        if (p.manualTestCases.some((item) => bad(item.memoryLimitMb, 16, 512)))
          errors.push({ selector: ".tc-mem", message: "测试点内存需在 16–512 MB 之间，留空表示继承题目级。" });
        return errors;
      }

      function validateForSubmit(status) {
        if (formState.type === "scratch") {
          const errors = [];
          const { errors: payloadErrors } = buildChallengePayload({ ...formState.scratch, hints_text: formState.scratch.hints_text });
          if (payloadErrors.length) errors.push({ selector: "#scratchTitle", message: payloadErrors[0] });
          if (status !== "draft") {
            const missing = publishChecks({ ...formState.scratch, ...scratchPayload() });
            if (missing.length) errors.push({ selector: "#scratchTitle", message: `发布前请完成：${missing.join("、")}` });
          }
          return errors;
        }
        // 草稿用于暂存工作，不要求题目已经完整；提交审核才执行完整校验。
        if (status === "draft") return validateLimits();
        const errors = validateLimits();
        const require = (selector, message) => errors.push({ selector, message });
        if (!hasMarkdownContent(formState.stem)) require("#fStem", "请填写题干。");
        if (formState.type === "choice" || formState.type === "multi_choice") {
          const options = formState.options;
          if (options.length < 2 || options.some((item) => !hasMarkdownContent(item.content)))
            require(".q-option", "请至少填写两个完整选项。");
          const correctCount = options.filter((item) => item.correct).length;
          if (formState.type === "choice" && correctCount !== 1)
            require('[name="correctOption"]', "选择题必须且只能选择一个正确答案。");
          if (formState.type === "multi_choice" && correctCount < 1)
            require('[name="correctOption"]', "请至少选择一个正确答案。");
        }
        if (formState.type === "fill") {
          if (!formState.fillBlanks.length)
            require("#fStem", "请使用空位标记（\\placeholder[blank_1]{}）、连续下划线或 {{blank}} 定义至少一个空位。");
          const keys = formState.fillBlanks.map((item) => item.blank_key);
          if (new Set(keys).size !== keys.length)
            require("#fStem", "每个填空的 placeholder 标识必须唯一。");
          // 拆完为空才算没填：只写了个 "|" 或 " | " 拆出来一条都没有，后端会 422
          if (formState.fillBlanks.some((item) => splitBlankAnswers(item.answer).length === 0))
            require(".blank-answer", "请填写每个空位的标准答案。");
        }
        if (formState.type === "programming") {
          const p = formState.programming;
          if (!p.title.trim()) require("#pTitle", "请填写题目标题。");
          if (!p.inputFormat.trim()) require("#pInput", "请填写输入格式。");
          if (!p.outputFormat.trim()) require("#pOutput", "请填写输出格式。");
          if (!p.refCode[formState.subType].trim())
            require("#pRefCode", `请填写 ${formState.subType === "python" ? "Python" : "C++"} 参考代码。`);
          if (p.passCondition === "全测试点通过" && formState.subType === "cpp") {
            const hasImportedTests = (p.testDataPackage?.manifest || []).length > 0;
            if (!hasImportedTests && !pendingCppZipFile)
              require("#cppZipInput", "已选择“全测试点通过”，请上传包含 N.in/N.out 的 ZIP。");
          } else if (p.passCondition === "全测试点通过" && (!p.manualTestCases.length || p.manualTestCases.some((item) => !item.input.trim() || !item.output.trim()))) {
            require(".tc-in", "已选择“全测试点通过”，请至少填写一个完整测试点。");
          }
        }
        return errors;
      }

      // 保存期间锁住底部按钮：网络慢时连点会重复创建草稿。
      function setSaving(busy, activeButtonId) {
        saving = busy;
        const scratchMode = formState?.type === "scratch";
        [
          ["saveDraftBtn", scratchMode ? "保存挑战草稿" : "保存草稿"],
          ["submitAuditBtn", scratchMode ? "发布挑战" : "提交审核"],
        ].forEach(([id, label]) => {
          const button = document.getElementById(id);
          button.disabled = busy;
          button.textContent = busy && id === activeButtonId ? "处理中…" : label;
        });
        document.getElementById("modalCancel").disabled = busy;
      }

      // 保存冲突（409）的三选一交互：confirmDialog 只有确认/取消两个按钮，
      // 用两段对话框表达三个选择——先问「重新加载」，取消后再问「强制覆盖」，
      // 再取消则回到表单（改动不丢，老师可以稍后再试）。
      async function resolveScratchConflict() {
        const reload = await confirmDialog({
          title: "保存冲突",
          message: "这个挑战刚被其他人（或其他标签页）修改过。",
          detail: "选择「重新加载最新版本」会丢弃你这次的改动，载入最新内容后再编辑；点「取消」可选择强制覆盖保存。",
          confirmText: "重新加载最新版本",
        });
        if (reload) return "reload";
        const force = await confirmDialog({
          title: "强制覆盖保存？",
          message: "会用你当前填写的内容覆盖对方刚才的修改，被覆盖的改动无法找回。",
          confirmText: "强制覆盖保存",
          danger: true,
        });
        return force ? "force" : null;
      }

      async function onSave(status) {
        if (saving) return;
        const validationErrors = validateForSubmit(status);
        if (validationErrors.length) {
          showModalErrors(validationErrors);
          toast(`还有 ${validationErrors.length} 处必填项未完成。`, "error");
          return;
        }
        clearModalErrors();
        setSaving(true, status === "draft" ? "saveDraftBtn" : "submitAuditBtn");
        try {
          if (formState.type === "scratch") {
            const s = formState.scratch;
            const payload = scratchPayload();
            // 乐观锁带 edit_seq（后端 base_version 比对的是它，不是发布版次 version）。
            // 保存成功后的响应带着递增后的 edit_seq，Object.assign 一并接住，
            // 连续多次保存才不会误报 409。
            let saved;
            try {
              saved = s.id
                ? await scratchRequest(`/scratch/challenges/${s.id}`, { method: "PUT", body: JSON.stringify({ ...payload, base_version: s.edit_seq }) })
                : await scratchRequest("/scratch/challenges", { method: "POST", body: JSON.stringify(payload) });
            } catch (error) {
              const conflict = s.id && /保存冲突/.test(error.message || "");
              if (!conflict) throw error;
              const choice = await resolveScratchConflict();
              if (choice === "reload") {
                // 丢弃本次改动，载入最新版本继续编辑。
                await openScratchChallenge(s.id);
                toast("已载入最新版本，请基于最新内容重新修改。", "info");
                return;
              }
              if (choice !== "force") return; // 老师取消：表单原样保留，改动不丢
              // 强制覆盖：重新拉取最新 edit_seq 再重试同一个 PUT。
              const latest = await scratchRequest(`/scratch/challenges/${s.id}`);
              s.edit_seq = latest.edit_seq;
              saved = await scratchRequest(`/scratch/challenges/${s.id}`, { method: "PUT", body: JSON.stringify({ ...payload, base_version: s.edit_seq }) });
            }
            Object.assign(s, saved); s.hints_text = (saved.hints || []).join("\n");
            // 保存成功：本会话上传的视频转为正式绑定（analysis_video_id 已入库）
            formState.uploadedVideoId = null;
            formState.uploadedVideoStatus = null;
            if (status === "pending") {
              const result = await scratchRequest(`/scratch/challenges/${s.id}/submit`, { method: "POST", body: "{}" });
              Object.assign(s, result.challenge || result);
              modalReadOnly = true;
            }
            initialSnapshot = snapshot();
            toast(status === "draft" ? "Scratch 挑战草稿已保存，请继续上传初始项目。" : "Scratch 挑战已提交审核。 ");
            renderAll();
            // Scratch 用独立挑战表保存，不能指望普通 /problems 的列表自动出现它。
            // 草稿保存后主动切到汇总草稿区并刷新，教师关闭弹窗就能立即找到刚保存的关卡。
            if (status === "draft") {
              zone = "draft";
              document.querySelectorAll(".zone-tabs button").forEach((button) => {
                button.classList.toggle("active", button.dataset.zone === zone);
              });
              list.page = 1;
              list.reload();
            }
            return;
          }
          // 先统一保存为草稿，确保 ZIP 能在草稿状态写入；再单独触发审核流转。
          const payload = buildPayload();
          const saved = editingId
            ? await adminRequest(`/problems/${editingId}`, { method: "PUT", headers: ifMatch(formState.revision), body: JSON.stringify(payload) })
            : await adminRequest("/problems", { method: "POST", body: JSON.stringify(payload) });
          editingId = saved.id || editingId;
          formState.revision = saved.revision;
          if (formState.type === "programming" && formState.subType === "cpp" && pendingCppZipFile) {
            const data = new FormData();
            data.append("archive", pendingCppZipFile);
            const uploaded = await adminUpload(`/problems/${editingId}/testdata-zip`, data, { headers: ifMatch(formState.revision) });
            formState.revision = uploaded.revision;
            pendingCppZipFile = null;
          }
          if (status === "pending") {
            await adminRequest(`/problems/${editingId}/submit`, { method: "POST", headers: ifMatch(formState.revision), body: "{}" });
          }
          zone = status === "draft" ? "draft" : "pending";
          list.page = 1;
          document.querySelectorAll(".zone-tabs button").forEach((button) =>
            button.classList.toggle("active", button.dataset.zone === zone),
          );
          closeModal();
          toast(status === "draft" ? "草稿已保存。" : "已提交审核。");
          list.reload();
        } catch (error) {
          const message = error.message || "保存失败，请检查网络或登录状态后重试。";
          showModalErrors([
            {
              selector: formState?.type === "programming" && formState.subType === "cpp" ? "#cppZipInput" : "#fStem",
              message,
            },
          ]);
          toast(message, "error");
        } finally {
          // closeModal 已在成功路径复位表单，这里只需解除按钮锁。
          setSaving(false);
        }
      }

      // =====================================================================
      // 六、事件绑定
      // =====================================================================
      const mask = document.getElementById("modalMask");
      let editingId = null;
      const previewMask = document.getElementById("previewMask");

      // 用户自己点过折叠区之后，syncLeftPanel 不再强行改它的开合状态。
      document.getElementById("taxonomyFold").addEventListener("toggle", (event) => {
        event.currentTarget.dataset.userToggled = "1";
      });
      document.getElementById("addBtn").addEventListener("click", () => openModal());
      document.getElementById("modalClose").addEventListener("click", handleClose);
      document.getElementById("modalCancel").addEventListener("click", handleClose);
      document.getElementById("previewProblemBtn").addEventListener("click", openWholePreview);
      document.getElementById("previewClose").addEventListener("click", closeWholePreview);
      mask.addEventListener("click", (e) => {
        if (e.target === mask) handleClose();
      });
      previewMask.addEventListener("click", (e) => {
        if (e.target === previewMask) closeWholePreview();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (!previewMask.hidden) {
          e.stopPropagation();
          closeWholePreview();
          return;
        }
        handleClose();
      });
      document.getElementById("saveDraftBtn").addEventListener("click", () => onSave("draft"));
      document.getElementById("submitAuditBtn").addEventListener("click", () => onSave("pending"));

      // 列表展示用的枚举文案；数据全部来自 /api/admin/problems。
      const TYPE_LABEL = {
        choice: "选择",
        multi_choice: "多选",
        judge: "判断",
        fill: "填空",
        programming: "操作题",
      };
      const STATUS_LABEL = {
        draft: ["草稿", "gray"],
        pending: ["待审核", "warn"],
        approved: ["已通过", ""],
      };
      const DIFFICULTY_LABEL = [
        // 洛谷同款难度分级（无颜色）
        "入门",
        "普及-",
        "普及/提高-",
        "普及+/提高",
        "提高+/省选-",
        "省选/NOI-",
        "NOI/NOI+/CTSC",
      ];

      // 左栏难度胶囊由常量驱动
      function renderDifficultyPills() {
        const group = document.getElementById("difficultyGroup");
        group.innerHTML = DIFFICULTY_LABEL.map(
          (label) => `
          <label class="pill">
            <input type="radio" name="qDifficulty" value="${label}" />
            <span>${label}</span>
          </label>`,
        ).join("");
        group.querySelectorAll('input[name="qDifficulty"]').forEach((r) =>
          r.addEventListener("change", () => {
            if (formState) formState.common.difficulty = r.value;
          }),
        );
      }
            // ==================== 列表：真实 API 数据（无假数据） ====================
      // 三态/骨架屏/分页器在 admin-list.js（试卷列表与组卷选题面板复用）；
      // 本页只负责筛选参数、行渲染与选择/批量逻辑。
      function displayStem(problem) {
        const text = markdownToText(problem.stem || problem.title).replace(/\s+/g, " ");
        // 纯图题干派生不出文字。回落到服务端派生的 title（那里给的是「[图片单选题]」
        // 这类占位），再兜一个空串——列表里那一行不能是完全空白的。
        return text || markdownToText(problem.title) || "";
      }
      // 默认停在「已通过（已发布）」：日常进题库是找能用的题，草稿/待审核是录入与审核的工作台。
      let zone = "approved";
      const selectedIds = new Set();
      const rows = document.getElementById("problemRows");
      const emptyTip = document.getElementById("emptyTip");
      const errorTip = document.getElementById("errorTip");
      const totalTip = document.getElementById("totalTip");

      document.getElementById("sDifficulty").innerHTML =
        '<option value="">全部</option>' +
        DIFFICULTY_LABEL.map((d) => `<option>${d}</option>`).join("");
      renderDifficultyPills();
      document.getElementById("sSource").innerHTML =
        '<option value="">全部</option>' +
        ["第三方", "原创", "自命题", "洛谷", "NOIP", "CSP-J", "CSP-S", "USACO"]
          .map((s) => `<option>${s}</option>`)
          .join("");

      // 审核动作由后端 allowed_actions 决定，前端不放宽；但要把"为什么不能审"讲清楚。
      function reviewBlockedReason(problem, allowed) {
        if (problem.status !== "pending" || allowed.has("approve")) return "";
        return '<span class="muted action-note" title="当前账号缺少内容审核权限">无审核权限</span>';
      }

      // 行渲染：页面专属（题型/难度/来源/知识点徽标 + 行内动作），三态交给列表组件。
      function renderProblemRows(items) {
        rows.innerHTML = items
          .map((problem) => {
            if (problem._entity === "scratch") {
              const title = problem.title || `Scratch 挑战 #${problem.challenge_id}`;
              const instructions = markdownToText(problem.instructions_md || "").replace(/\s+/g, " ");
              const scratchLabel = { draft: "草稿", pending: "待审核", published: "已通过" }[problem.status] || problem.status;
              // 状态动作与既有题目（problems 行）对齐：
              //   draft → 编辑 / 提交审核 / 删除（仅草稿可提交与直接删）
              //   pending → 通过 / 打回（审核中不给删除，同题目口径）
              //   published → 查看（只读）/ 修改（= 撤回成草稿再编辑，同题目的 revise 语义） / 删除（同题目：未引用可删）
              const scratchActions = problem.status === "draft"
                ? `<button class="btn-text link" type="button" data-edit-scratch="${problem.challenge_id}">编辑</button><button class="btn-text link" type="button" data-scratch-action="submit" data-scratch-id="${problem.challenge_id}">提交审核</button><button class="btn-text link danger" type="button" data-scratch-action="delete" data-scratch-id="${problem.challenge_id}">删除</button>`
                : problem.status === "pending"
                  ? `<button class="btn-text link" type="button" data-scratch-action="approve" data-scratch-id="${problem.challenge_id}">通过</button><button class="btn-text link danger" type="button" data-scratch-action="reject" data-scratch-id="${problem.challenge_id}">打回</button>`
                  : `<button class="btn-text link" type="button" data-view-scratch="${problem.challenge_id}">查看</button><button class="btn-text link" type="button" data-scratch-action="unpublish" data-scratch-id="${problem.challenge_id}">修改</button><button class="btn-text link danger" type="button" data-scratch-action="delete" data-scratch-id="${problem.challenge_id}">删除</button>`;
              const scratchRejectFlag = problem.rejection?.reason
                ? `<span class="reject-flag" title="最近打回：${escapeHtml(problem.rejection.reason)}">⚑</span>`
                : "";
              return `
        <tr data-scratch-row="${problem.challenge_id}">
          <td><input type="checkbox" class="check row-check" data-scratch-id="${problem.challenge_id}" aria-label="选择 Scratch 挑战 ${escapeHtml(title)}" ${selectedIds.has(problem.id) ? "checked" : ""} /></td>
          <td>SC-${problem.challenge_id}</td>
          <td><span class="tag">Scratch</span></td>
          <td class="cell-clip" title="${escapeHtml(instructions)}"><strong>${escapeHtml(title)}</strong>${instructions ? `<br><span class="muted">${escapeHtml(instructions)}</span>` : ""}</td>
          <td>—</td><td>原创</td><td>—</td><td>—</td>
          <td><span class="tag ${problem.status === "pending" ? "warn" : problem.status === "published" ? "" : "gray"}">${scratchLabel}</span>${scratchRejectFlag}</td>
          <td><div class="row-actions">${scratchActions}</div></td>
        </tr>`;
            }
            const allowed = new Set(problem.allowed_actions || []);
            const actions = [
              allowed.has("edit")
                ? `<button class="btn-text link" type="button" data-edit="${problem.id}">编辑</button>`
                : `<button class="btn-text link" type="button" data-view="${problem.id}">查看</button>`,
              allowed.has("approve")
                ? `<button class="btn-text link" type="button" data-approve="${problem.id}">通过</button>`
                : "",
              allowed.has("reject")
                ? `<button class="btn-text link danger" type="button" data-reject="${problem.id}">打回</button>`
                : "",
              // 已发布题的"修改"= 开一份草稿副本；线上内容在副本通过前不变。
              allowed.has("revise")
                ? `<button class="btn-text link" type="button" data-revise="${problem.id}">修改</button>`
                : "",
              allowed.has("view_revision")
                ? `<button class="btn-text link" type="button" data-open-revision="${problem.open_revision.id}">查看修订稿</button>`
                : "",
              allowed.has("delete")
                ? `<button class="btn-text link danger" type="button" data-delete="${problem.id}">删除</button>`
                : "",
              // 待审题却没有审核动作时必须说明原因：按钮凭空消失只会让人以为界面坏了。
              reviewBlockedReason(problem, allowed),
            ].join("");
            const stem = displayStem(problem);
            const difficulty = problem.common?.difficulty ?? problem.difficulty ?? "—";
            const source = problem.common?.source ?? problem.source ?? "—";
            const knowledge = problem.common?.knowledge || [];
            // 知识点可能很多，行内只展示两个，其余折叠成 +N 并在 title 里给全量。
            const knowledgeCell = knowledge.length
              ? knowledge
                  .slice(0, 2)
                  .map((tag) => `<span class="tag gray" style="margin-right:4px">${escapeHtml(tag)}</span>`)
                  .join("") + (knowledge.length > 2 ? `<span class="muted">+${knowledge.length - 2}</span>` : "")
              : "—";
            // 打回原因是录入员最需要的信息，列表里必须能看到，不用打开题目才知道。
            const rejectFlag = problem.rejection?.reason
              ? `<span class="reject-flag" title="最近打回：${escapeHtml(problem.rejection.reason)}">⚑</span>`
              : "";
            const version = problem.version_no > 1 ? `<span class="muted"> v${problem.version_no}</span>` : "";
            // 线上这一版正被修订：状态列点明，否则会以为"修改"按钮无故消失。
            const revisionFlag = problem.open_revision
              ? `<span class="tag warn" style="margin-left:4px" title="修订稿 #${problem.open_revision.id} ${problem.open_revision.status === "pending" ? "待审核" : "编辑中"}，通过后替换当前版本">修订中</span>`
              : "";
            return `
        <tr data-row="${problem.id}">
          <td><input type="checkbox" class="check row-check" data-id="${problem.id}" aria-label="选择试题 ${escapeHtml(stem.slice(0, 20))}" ${selectedIds.has(problem.id) ? "checked" : ""} /></td>
          <td>${escapeHtml(problem.problem_id_no || "—")}${version}</td>
          <td><span class="tag">${escapeHtml(TYPE_LABEL[problem.type] || problem.type)}</span></td>
          <td class="cell-clip" title="${escapeHtml(stem)}">${escapeHtml(stem) || '<span class="muted">（未填写题干）</span>'}</td>
          <td>${escapeHtml(difficulty)}</td>
          <td>${escapeHtml(source)}</td>
          <td class="cell-clip">${escapeHtml(problem.owner?.display_name || "未分配")}</td>
          <td>${knowledgeCell}</td>
          <td><span class="tag ${STATUS_LABEL[problem.status]?.[1] || "gray"}">${STATUS_LABEL[problem.status]?.[0] || "未知"}</span>${rejectFlag}${revisionFlag}</td>
          <td><div class="row-actions">${actions}</div></td>
        </tr>`;
          })
          .join("");
      }

      // 批量条只放行「当前所有勾选项都被后端允许」的动作，避免一半成功一半 403。
      function renderBatchBar() {
        const bar = document.getElementById("batchBar");
        const chosen = list.items.filter((item) => selectedIds.has(item.id));
        bar.hidden = chosen.length === 0;
        document.getElementById("batchCount").textContent = chosen.length;
        [
          ["batchSubmitBtn", "submit"],
          ["batchApproveBtn", "approve"],
          ["batchRejectBtn", "reject"],
          ["batchDeleteBtn", "delete"],
        ].forEach(([id, action]) => {
          document.getElementById(id).hidden =
            !chosen.length || !chosen.every((item) => (item.allowed_actions || []).includes(action));
        });
      }

      const list = createPagedList({
        els: {
          rows,
          emptyTip,
          errorTip,
          errorText: document.getElementById("errorText"),
          totalTip,
          prevBtn: document.getElementById("prevPageBtn"),
          nextBtn: document.getElementById("nextPageBtn"),
          retryBtn: document.getElementById("retryBtn"),
          pageSizeSelect: document.getElementById("pageSize"),
          checkAll: document.getElementById("checkAll"),
        },
        skeletonCols: 10,
        fetchPage: async ({ page, size }) => {
          const params = new URLSearchParams({ status: zone, page, size });
          const get = (id) => document.getElementById(id).value.trim();
          if (get("sKeyword")) params.set("keyword", get("sKeyword"));
          if (get("sType")) params.set("type", get("sType"));
          if (get("sDifficulty")) params.set("difficulty", get("sDifficulty"));
          if (get("sSource")) params.set("source", get("sSource"));
          if (get("sTag")) params.set("knowledge", get("sTag"));
          if (get("sOwner")) params.set("owner_id", get("sOwner"));
          // 挑战没有难度/来源/知识点/负责人这些字段，挑战接口也筛不了；这些条件一旦生效
          // 还把挑战并进来，就会出现「筛了却筛不掉」的行，总数也跟着虚高。关键词两边都支持。
          const problemOnlyFilter = ["sType", "sDifficulty", "sSource", "sTag", "sOwner"].some((id) => get(id));
          const scratchStatus = problemOnlyFilter
            ? null
            : { draft: "draft", pending: "pending", approved: "published" }[zone];
          const scratchParams = new URLSearchParams({ status: scratchStatus || "draft", page: "1", size: "100" });
          if (get("sKeyword")) scratchParams.set("keyword", get("sKeyword"));
          const [data, statusSummary, scratchDrafts, scratchAll] = await Promise.all([
            adminRequest(`/problems?${params}`),
            adminRequest("/problem-status-counts"),
            scratchStatus
              ? scratchRequest(`/scratch/challenges?${scratchParams}`)
              : Promise.resolve(null),
            // 三个分区的徽标都要把挑战算进去，而上面那次只查了当前分区的一页；
            // options 是全量精简列表，一次就能按状态分完三份。挂了就退回只数普通题，
            // 不能让徽标这种附属信息把整张列表拖进 error 态。
            scratchRequest("/scratch/challenges/options").catch(() => null),
          ]);
          // 挑战状态 → 题库分区（archived 不属于任何分区，忽略）。
          const scratchZone = { draft: "draft", pending: "pending", published: "approved" };
          const scratchZoneCount = { draft: 0, pending: 0, approved: 0 };
          (scratchAll?.items || []).forEach((challenge) => {
            const target = scratchZone[challenge.status];
            if (target) scratchZoneCount[target] += 1;
          });
          // 徽标是「分区总量」：普通题 + Scratch 挑战，与 /problem-status-counts 同口径
          // 不随筛选变化（筛选后的条数由分页器的「共 N 条」负责）。
          Object.entries(statusSummary.counts || {}).forEach(([status, count]) => {
            const node = document.getElementById(`${status}Count`);
            if (node) node.textContent = Number(count) + (scratchZoneCount[status] || 0);
          });
          if (scratchDrafts) {
            // Scratch 的提交/审核状态机与普通题不同，故只把它作为只读的题库行汇总；
            // 编辑仍走挑战接口，批量普通题动作也不会误作用到它。
            const scratchItems = (scratchDrafts.items || []).map((challenge) => ({
              _entity: "scratch",
              id: `scratch-${challenge.id}`,
              challenge_id: challenge.id,
              type: "scratch",
              title: challenge.title,
              instructions_md: challenge.instructions_md,
              status: challenge.status,
              allowed_actions: challenge.status === "draft"
                ? ["submit", "delete"]
                : challenge.status === "pending"
                  ? ["approve", "reject"]
                  : ["revise"],
            }));
            // Scratch 项钉在第一页展示一次，不随翻页移动，因此走 extra_total 而不是 total：
            // 页数只按普通题算（挑战不占页），条数把挑战算上。加进 total 会凭空多出一页空页
            //（普通题在 ceil(P/size) 页就翻完了，多出来的那页请求的是越界的 offset）。
            // 徽标不在这里写：这里只知道当前分区的挑战数，写谁都是把别的分区写成假数
            //（旧代码无条件写 draftCount，默认停在「已通过」时就把已通过的总数写进了草稿徽标，
            // 于是草稿显示 6、点进去只有 1）。三个分区统一在上面按 options 的全量状态分布算。
            if (page === 1) data.items = [...scratchItems, ...(data.items || [])];
            data.extra_total = Number(scratchDrafts.total || 0);
          }
          return data;
        },
        renderRows: renderProblemRows,
        onBeforeLoad: () => selectedIds.clear(),
        afterRender: () => renderBatchBar(),
      });

      document.querySelectorAll(".zone-tabs button").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll(".zone-tabs button")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          zone = btn.dataset.zone;
          list.page = 1;
          list.reload();
        });
      });
      document.getElementById("searchBtn").addEventListener("click", () => {
        list.page = 1;
        list.reload();
      });
      document.getElementById("sKeyword").addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          list.page = 1;
          list.reload();
        }
      });
      document.getElementById("resetBtn").addEventListener("click", () => {
        ["sKeyword", "sType", "sDifficulty", "sSource", "sTag", "sOwner"].forEach(
          (id) => (document.getElementById(id).value = ""),
        );
        document.querySelectorAll(".sel-combo input").forEach((input) => (input.value = ""));
        document.querySelectorAll(".sel-combo-drop").forEach((drop) => (drop.hidden = true));
        list.page = 1;
        list.reload();
      });
      document.getElementById("checkAll").addEventListener("change", (e) => {
        selectedIds.clear();
        if (e.target.checked) list.items.forEach((item) => selectedIds.add(item.id));
        document
          .querySelectorAll("#problemRows .row-check")
          .forEach((el) => (el.checked = e.target.checked));
        renderBatchBar();
      });
      rows.addEventListener("change", (e) => {
        const box = e.target.closest(".row-check");
        if (!box) return;
        const id = box.dataset.scratchId ? `scratch-${box.dataset.scratchId}` : Number(box.dataset.id);
        if (box.checked) selectedIds.add(id);
        else selectedIds.delete(id);
        document.getElementById("checkAll").checked =
          list.items.length > 0 && list.items.every((item) => selectedIds.has(item.id));
        renderBatchBar();
      });
      document.getElementById("batchClearBtn").addEventListener("click", () => {
        selectedIds.clear();
        document.querySelectorAll("#problemRows .row-check").forEach((el) => (el.checked = false));
        document.getElementById("checkAll").checked = false;
        renderBatchBar();
      });

      // 批量执行：逐条串行调用，单条失败不影响其余，最后汇总结果。
      async function runBatch(action, { title, message, confirmText, danger }) {
        const targets = list.items.filter(
          (item) => selectedIds.has(item.id) && (item.allowed_actions || []).includes(action),
        );
        if (!targets.length) return;
        let reason = null;
        if (action === "reject") {
          // 打回必须有原因；批量场景下一条原因适用于本次选中的全部题目。
          reason = await promptDialog({
            title,
            message: `${message}（共 ${targets.length} 题）`,
            label: "打回原因",
            placeholder: "这条原因会写入本次选中的每一道题。",
            confirmText,
            danger: true,
          });
          if (!reason) return;
        } else {
          const ok = await confirmDialog({
            title,
            message: `${message}（共 ${targets.length} 题）`,
            detail: "该操作会逐条提交，失败的题目会保留原状态。",
            confirmText,
            danger,
          });
          if (!ok) return;
        }
        const failures = [];
        for (const item of targets) {
          try {
            if (item._entity === "scratch") {
              if (action === "delete") await scratchRequest(`/scratch/challenges/${item.challenge_id}`, { method: "DELETE" });
              else await scratchRequest(`/scratch/challenges/${item.challenge_id}/${action}`, { method: "POST", body: "{}" });
            } else {
              const options = { headers: ifMatch(item.revision) };
              if (action === "delete") await adminRequest(`/problems/${item.id}`, { method: "DELETE", ...options });
              else
              await adminRequest(`/problems/${item.id}/${action}`, {
                method: "POST",
                ...options,
                body: JSON.stringify(action === "reject" ? { reason } : {}),
              });
            }
          } catch (error) {
            failures.push(`#${item.id} ${error.message || "失败"}`);
          }
        }
        if (failures.length)
          toast(`${targets.length - failures.length} 题成功，${failures.length} 题失败：${failures[0]}`, "error");
        else toast(`已处理 ${targets.length} 题。`);
        list.reload();
      }

      document.getElementById("batchSubmitBtn").addEventListener("click", () =>
        runBatch("submit", { title: "批量提交审核", message: "确认将选中的草稿提交审核？", confirmText: "提交审核" }),
      );
      document.getElementById("batchApproveBtn").addEventListener("click", () =>
        runBatch("approve", { title: "批量通过", message: "确认通过选中的题目并分配对外编号？", confirmText: "全部通过" }),
      );
      document.getElementById("batchRejectBtn").addEventListener("click", () =>
        runBatch("reject", { title: "批量打回", message: "选中的题目将退回录入员修改。", confirmText: "确认打回" }),
      );
      document.getElementById("batchDeleteBtn").addEventListener("click", () =>
        runBatch("delete", {
          title: "批量删除",
          message: "删除后题目的答案与测试数据无法恢复。",
          confirmText: "确认删除",
          danger: true,
        }),
      );

      // 行操作由后端返回的 allowed_actions 决定，前端不自行放宽状态权限。
      rows.addEventListener("click", async (e) => {
        const scratchEdit = e.target.closest("[data-edit-scratch]");
        if (scratchEdit) {
          openScratchChallenge(Number(scratchEdit.dataset.editScratch));
          return;
        }
        // 「查看」= 打开只读表单（published 挑战打开即只读，与题目「查看」同义）
        const scratchView = e.target.closest("[data-view-scratch]");
        if (scratchView) {
          openScratchChallenge(Number(scratchView.dataset.viewScratch));
          return;
        }
        const scratchAction = e.target.closest("[data-scratch-action]");
        if (scratchAction) {
          const action = scratchAction.dataset.scratchAction;
          const challengeId = Number(scratchAction.dataset.scratchId);
          const labels = { submit: "提交审核", approve: "通过", reject: "打回", delete: "删除", duplicate: "创建新草稿版本", unpublish: "撤回并修改" };
          const danger = action === "delete" || action === "reject";
          // 打回必填原因（对齐题目 reject 口径）：录入员在列表 ⚑ 就能看到为什么被退。
          let rejectReason = "";
          if (action === "reject") {
            rejectReason = await promptDialog({
              title: "打回 Scratch 挑战",
              message: "打回原因会写入挑战记录，列表 ⚑ 可见。",
              label: "打回原因",
              placeholder: "说明需要修改的地方…",
              confirmText: "确认打回",
              danger: true,
            });
            if (rejectReason == null) return;
            rejectReason = String(rejectReason).trim();
            if (!rejectReason) { toast("请填写打回原因。", "error"); return; }
          }
          // 已发布挑战的「修改」= 撤回成草稿再编辑（对齐既有题目 revise 的语义：改的是当前
          // 这题而不是另起一个）。撤回后学生端立即不可见，改完重新提交审核通过即新版本。
          const confirm = action === "unpublish"
            ? {
                title: "修改已发布挑战",
                message: `将「${(list.items.find((i) => i._entity === "scratch" && i.challenge_id === challengeId)?.title) || `#${challengeId}`}」撤回为草稿进行修改。`,
                detail: "撤回后学生端立即不可见；修改完成重新提交审核、通过后即为新版本（版本号 +1），历史判定记录不受影响。若该挑战正被已发布课包使用会被拒绝，请先下架相关课包。",
                confirmText: "撤回并修改",
              }
            : {
                title: `Scratch 挑战：${labels[action]}`,
                message: `确认${labels[action]}该 Scratch 挑战？`,
                confirmText: labels[action],
                danger,
              };
          const ok = await confirmDialog(confirm);
          if (!ok) return;
          try {
            const response = action === "delete"
              ? await scratchRequest(`/scratch/challenges/${challengeId}`, { method: "DELETE" })
              : await scratchRequest(`/scratch/challenges/${challengeId}/${action}`, {
                  method: "POST",
                  body: JSON.stringify(action === "reject" ? { reason: rejectReason } : {}),
                });
            if (action === "duplicate") {
              toast("已创建 Scratch 挑战草稿版本。");
              await openScratchChallenge(response.id);
            } else if (action === "unpublish") {
              toast("已撤回为草稿，请继续修改。");
              await openScratchChallenge(challengeId);
            } else toast(`Scratch 挑战已${labels[action]}。`);
            list.page = 1;
            list.reload();
          } catch (error) { toast(error.message, "error"); }
          return;
        }
        const link = e.target.closest("[data-edit],[data-view],[data-approve],[data-reject],[data-delete],[data-revise],[data-open-revision]");
        if (!link) return;
        const id = Number(
          link.dataset.edit || link.dataset.view || link.dataset.approve || link.dataset.reject || link.dataset.delete || link.dataset.revise || link.dataset.openRevision,
        );
        if (!id) return;
        if (link.dataset.edit || link.dataset.view || link.dataset.openRevision) {
          openModal(id);
          return;
        }
        const problem = list.items.find((item) => item.id === id);
        if (!problem) return;
        const mutation = { headers: ifMatch(problem.revision) };
        const stem = displayStem(problem).slice(0, 40) || `#${problem.id}`;
        try {
          if (link.dataset.revise) {
            const ok = await confirmDialog({
              title: "修改已发布题目",
              message: `将「${stem}」开出一份草稿副本进行修改。`,
              detail: `线上内容在副本通过审核前保持不变；副本通过后继承编号 ${problem.problem_id_no || ""}，试卷引用不受影响。`,
              confirmText: "开始修改",
            });
            if (!ok) return;
            const draft = await adminRequest(`/problems/${id}/revise`, { method: "POST", ...mutation, body: "{}" });
            toast("已创建修订稿，可直接编辑。");
            await list.reload();
            openModal(draft.id); // 直接进编辑，省掉"去草稿区找一遍"这一步
            return;
          } else if (link.dataset.delete) {
            const ok = await confirmDialog({
              title: "删除题目",
              message: `确认删除「${stem}」？`,
              detail:
                problem.status === "approved"
                  ? "已发布题目删除后，引用它的试卷会失去这道题，且答案与测试数据无法恢复。"
                  : "题目的答案与测试数据将一并删除，无法恢复。",
              confirmText: "确认删除",
              danger: true,
            });
            if (!ok) return;
            await adminRequest(`/problems/${id}`, { method: "DELETE", ...mutation });
            list.retreatIfEmpty();
            toast("题目已删除。");
          } else if (link.dataset.reject) {
            // 打回原因是审核留痕的一部分，必须走带校验的表单而不是原生 prompt。
            const reason = await promptDialog({
              title: "打回修改",
              message: `将「${stem}」退回给录入员修改。`,
              label: "打回原因",
              placeholder: "例如：C 选项与题干矛盾，请重新核对标准答案。",
              confirmText: "确认打回",
              danger: true,
            });
            if (!reason) return;
            await adminRequest(`/problems/${id}/reject`, { method: "POST", ...mutation, body: JSON.stringify({ reason }) });
            toast("已打回，录入员可在草稿区看到原因。");
          } else {
            const isRevision = problem.root_problem_id !== problem.id;
            const ok = await confirmDialog({
              title: "通过题目",
              message: `确认通过「${stem}」？`,
              detail: isRevision
                ? "这是一份修订稿：通过后将继承线上编号并替换当前发布的版本。"
                : "通过后系统分配对外题目编号，可用于组卷。",
              confirmText: "确认通过",
            });
            if (!ok) return;
            await adminRequest(`/problems/${id}/approve`, { method: "POST", ...mutation, body: "{}" });
            toast("已通过。");
          }
          list.reload();
        } catch (error) {
          toast(error.message || "操作失败，请重新加载后重试。", "error");
          list.reload();
        }
      });

      // 标签选项 + 知识点树（GET /api/admin/tags；失败回退本地树）
      async function loadTags() {
        try {
          const data = await adminRequest("/tags");
          const tags = data.knowledge || [];
          if (tags.length) {
            // 后端按 parent_id 还原三级结构（一级=阶段，二级=主题，三级=叶子）。
            const byId = new Map(tags.map((t) => [String(t.id), { id: String(t.id), name: t.name, desc: t.description || "", children: [] }]));
            const roots = [];
            tags.forEach((t) => {
              const node = byId.get(String(t.id));
              const parent = t.parent_id != null ? byId.get(String(t.parent_id)) : null;
              if (parent) parent.children.push(node);
              else roots.push(node);
            });
            kt.setTree(roots);
            // 隐藏 select 仅承载当前筛选值（列表组件读取）；可选值 = 全部节点（阶段/主题/叶子）。
            const allNames = tags.map((t) => t.name);
            document.getElementById("sTag").innerHTML =
              '<option value="">全部</option>' +
              allNames.map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join("");
          }
        } catch {
          // 后端不可用时保留本地树与空筛选
        }
      }

      async function loadCurrentAdmin() {
        currentAdmin = await adminMe();
      }

      async function loadOwners() {
        const data = await adminRequest("/problem-owners");
        document.getElementById("sOwner").innerHTML =
          '<option value="">全部</option>' +
          (data.items || [])
            .map((owner) => `<option value="${owner.id}">${escapeHtml(owner.display_name)}</option>`)
            .join("");
      }

      // ============ 列表页 · 统一筛选选择器（输入框 + 下拉，方框样式与原生 select 一致） ============
      // 普通筛选（题型/难度/来源/负责人）= 文本列表；知识点 = 三级树形文本（点节点 = 筛选含全部下级，点 ▶ = 展开）。
      function initCombo(selectId, options = {}) {
        const select = document.getElementById(selectId);
        const wrapper = document.createElement("div");
        wrapper.className = "sel-combo";
        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = options.placeholder || "";
        input.autocomplete = "off";
        const drop = document.createElement("div");
        drop.className = "sel-combo-drop";
        drop.hidden = true;
        wrapper.append(input, drop);
        select.hidden = true;
        select.insertAdjacentElement("afterend", wrapper);

        const getOptions = () =>
          [...select.options].filter((o) => o.value !== "").map((o) => ({ value: o.value, label: o.text }));

        const selectValue = (value, label) => {
          select.value = value;
          input.value = label;
          drop.hidden = true;
        };

        const renderDrop = (keyword = "") => {
          drop.innerHTML = "";
          if (options.tree) { renderTree(keyword.trim()); return; }
          const kw = keyword.trim();
          const hits = kw ? getOptions().filter((o) => o.label.includes(kw)) : getOptions();
          if (!hits.length) { drop.hidden = true; return; }
          const all = document.createElement("li");
          all.textContent = "全部";
          all.dataset.role = "all";
          all.addEventListener("click", () => selectValue("", ""));
          drop.appendChild(all);
          hits.forEach((o) => {
            const li = document.createElement("li");
            li.textContent = o.label;
            li.addEventListener("click", () => selectValue(o.value, o.label));
            drop.appendChild(li);
          });
          drop.hidden = false;
        };

        // 知识点：三级树形文本（一级/二级/三级缩进呈现）
        const treeOpen = new Set();
        const renderTree = (kw) => {
          const nodeVisible = (n) => !kw || n.name.includes(kw) || (n.children || []).some(nodeVisible);
          const renderList = (nodes, depth) => {
            const ul = document.createElement("ul");
            nodes.forEach((node) => {
              if (kw && !nodeVisible(node)) return;
              const hasKids = node.children && node.children.length;
              const li = document.createElement("li");
              if (hasKids) {
                li.className =
                  (depth === 0 ? "sel-tree-stage" : "sel-tree-group") +
                  (treeOpen.has(node.id) || (kw && nodeVisible(node)) ? " open" : "");
                const row = document.createElement("div");
                row.className = "sel-tree-row";
                const arrow = document.createElement("span");
                arrow.className = "arrow";
                arrow.textContent = "▶";
                const name = document.createElement("span");
                name.className = "sel-tree-name";
                name.textContent = `${node.num ? node.num + " " : ""}${node.name}`;
                name.title = node.desc || "";
                row.append(arrow, name);
                arrow.addEventListener("click", (e) => {
                  e.stopPropagation();
                  li.classList.toggle("open");
                  if (li.classList.contains("open")) treeOpen.add(node.id);
                  else treeOpen.delete(node.id);
                });
                row.addEventListener("click", () => selectValue(node.name, node.name));
                li.append(row, renderList(node.children, depth + 1));
              } else {
                li.className = "sel-tree-leaf";
                const name = document.createElement("span");
                name.className = "sel-tree-name";
                name.textContent = `${node.num ? node.num + " " : ""}${node.name}`;
                name.title = node.desc || "";
                li.append(name);
                li.addEventListener("click", () => selectValue(node.name, node.name));
              }
              ul.appendChild(li);
            });
            return ul;
          };
          const list = renderList(kt.getTreeData(), 0);
          list.className = "sel-tree";
          drop.appendChild(list);
          drop.hidden = list.children.length === 0;
        };

        input.addEventListener("focus", () => renderDrop(input.value));
        input.addEventListener("input", () => renderDrop(input.value));
        input.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            const first = [...drop.querySelectorAll("li")].find((li) => li.dataset.role !== "all");
            if (first) (first.querySelector(".sel-tree-row") || first).click();
          } else if (e.key === "Escape") {
            drop.hidden = true;
          }
        });
        document.addEventListener("mousedown", (e) => {
          if (!wrapper.contains(e.target)) drop.hidden = true;
        });
      }
      // 统一初始化（隐藏原生 select 仅承载筛选值，列表组件/reset 逻辑不变）
      initCombo("sType");
      initCombo("sDifficulty");
      initCombo("sSource", { placeholder: "输入筛选，如：洛谷" });
      initCombo("sOwner", { placeholder: "输入负责人筛选" });
      initCombo("sTag", { tree: true, placeholder: "输入筛选，如：背包" });

      // 引导：登录态/负责人/标签任一失败都不应让整页停在空白，
      // 列表照常加载，缺失的下拉项由各自的兜底逻辑处理。
      async function bootstrap() {
        const results = await Promise.allSettled([loadCurrentAdmin(), loadOwners(), loadTags()]);
        const failed = results.find((item) => item.status === "rejected");
        if (failed) toast(failed.reason?.message || "部分筛选项加载失败。", "error");
        await list.reload();
        if (new URLSearchParams(location.search).get("mode") === "scratch") openModal(null, "scratch");
      }
      bootstrap();
    </script>
  </body>
</html>
