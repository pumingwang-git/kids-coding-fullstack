<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>修改后台密码 · 启程学堂后台</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card admin-password-card">
      <p class="eyebrow">ACCOUNT SECURITY</p>
      <h1>修改后台密码</h1>
      <p class="muted" id="passwordLead">首次登录必须设置只有你本人知道的新密码。</p>
      <form id="passwordForm">
        <label>当前密码<input id="currentPassword" type="password" autocomplete="current-password" maxlength="128" required /></label>
        <label>新密码<input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required /></label>
        <label>确认新密码<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required /></label>
        <ul class="password-rules"><li>至少 12 个字符</li><li>包含英文字母、数字和特殊符号</li></ul>
        <p id="passwordError" class="form-error" hidden></p>
        <button class="button button-primary full" id="passwordSubmit" type="submit">保存新密码</button>
      </form>
    </section>
  </main>
  <script type="module">
    import { adminMe, adminRequest } from "./admin-api.js";
    const $ = (id) => document.getElementById(id);
    let me = null;
    try {
      me = await adminMe();
      if (!me.must_change_password) $("passwordLead").textContent = "更新后，其他已登录设备会被退出。";
    } catch {
      location.replace(`login.html?next=${encodeURIComponent(location.pathname)}`);
    }
    $("passwordForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      $("passwordError").hidden = true;
      const currentPassword = $("currentPassword").value;
      const newPassword = $("newPassword").value;
      if (newPassword !== $("confirmPassword").value) {
        $("passwordError").textContent = "两次输入的新密码不一致。";
        $("passwordError").hidden = false;
        return;
      }
      $("passwordSubmit").disabled = true;
      try {
        await adminRequest("/password-change", { method: "PUT", body: JSON.stringify({ current_password: currentPassword, new_password: newPassword }) });
        location.replace("index.html");
      } catch (error) {
        $("passwordError").textContent = error.message;
        $("passwordError").hidden = false;
      } finally {
        $("passwordSubmit").disabled = false;
      }
    });
  </script>
</body>
</html>
