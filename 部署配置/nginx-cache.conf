# 生产 Nginx 缓存策略示例（P1-4）
#
# 位置：前端构建产物目录（study-blog-vue/dist）对应的站点 server 块。
# 本文件是**模板**：域名、证书、上游端口请按实际环境替换后合入现有配置。
#
# 为什么这么配（评审 P1-4 结论）：
# - dist/index.html 必须 no-cache：它引用带 hash 的 chunk，缓存旧 index.html 会
#   让老用户继续请求已不存在的旧 chunk → 发版后白屏。
# - dist/assets/ 是 Vite 产物，文件名带内容 hash：内容变了名字就变，可以
#   immutable 长缓存，永远不需要重新验证。
# - dist/admin/ 是**原生 HTML/JS，文件名固定**（admin-api.js、admin.css…），
#   没有 hash 可依赖：发版后同名覆盖，immutable 会让浏览器永远用旧代码。
#   只能 no-cache（每次回源验证，ETag 命中 304，只多一次条件请求）。
# - /assets/ 下的水獭图片等是 public/ 原样拷贝的固定文件名资源：同样不能
#   immutable，短缓存 + ETag 即可（变了最多滞后 10 分钟）。
# - /api/ 与 /v/ 全部是私有内容，这里禁止 proxy_cache，确保不在反代/CDN 层被共享缓存。
#   但**不在 nginx 上一刀切写 Cache-Control**：/api/ 下既有 JSON（no-store），也有
#   资料字节流（private, max-age=600 + ETag，要能进浏览器磁盘缓存），粒度由后端按
#   content-type 决定（NoStoreJSONMiddleware 只管 application/json）。详见 /api/ 那段。
# - /media、/course-covers、/avatars 是上传的题干配图/课包封面/学生头像：
#   固定文件名，短缓存 + ETag；
#   生产由 nginx 直发（后端只在非 production 挂 StaticFiles）。

server {
    listen 443 ssl http2;
    server_name study.example.com;

    # —— TLS 证书（示例）——
    # ssl_certificate     /etc/nginx/ssl/study.example.com.pem;
    # ssl_certificate_key /etc/nginx/ssl/study.example.com.key;

    # —— 静态资源：SPA 根目录（Vite build 产物）——
    root /var/www/study-blog-vue/dist;
    index index.html;

    # ---------------------------------------------------------------
    # 1) index.html：永不缓存，回源每次验证（ETag/Last-Modified → 304）
    # ---------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache";
        # 命中 304 的协商缓存依赖 ETag，默认开启，无需额外配置
    }

    # ---------------------------------------------------------------
    # 2) Vite 带 hash 产物：immutable 长缓存（一年）。
    #    正则 location 优先级高于前缀 location /assets/，两类资源分流：
    #    JS/CSS 是 Vite 产物（文件名带内容 hash）→ immutable；
    #    public/ 拷来的固定文件名图片（otter-*.png）→ 短缓存，不 immutable。
    # ---------------------------------------------------------------
    location ~* ^/assets/.*\.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* ^/assets/.*\.(png|jpe?g|gif|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=600";
    }
    location /assets/ {
        # 其它（字体、音频等）保守处理
        add_header Cache-Control "public, max-age=3600";
    }

    # ---------------------------------------------------------------
    # 3) 管理端（原生 HTML/JS，固定文件名）：每次重新验证，绝不长缓存
    # ---------------------------------------------------------------
    location /admin/ {
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------
    # 4) 上传的题干配图 / 课包封面 / 学生头像：nginx 直发，短缓存 + ETag
    #    目录路径与后端 config 的 media_upload_root / course_cover_upload_root /
    #    avatar_upload_root
    #    保持一致（示例假设后端工作目录 /opt/auth_service）
    # ---------------------------------------------------------------
    location /media/ {
        alias /opt/auth_service/data/media/;
        add_header Cache-Control "public, max-age=600";
    }
    location /course-covers/ {
        alias /opt/auth_service/data/course_covers/;
        add_header Cache-Control "public, max-age=600";
    }
    location /avatars/ {
        alias /opt/auth_service/data/avatars/;
        add_header Cache-Control "public, max-age=600";
    }

    # ---------------------------------------------------------------
    # 5) 私有 API 与视频流：反代后端，禁止任何共享缓存
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 禁用 proxy_cache：/api/ 一律不进反代/CDN 的共享缓存。
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        # **不要**在这里 add_header Cache-Control "private, no-store"。
        # /api/ 下不只有 JSON：学生端资料代理
        # （/api/lessons/{id}/blocks/{id}/materials/{id}/inline）返回的是 PDF/图片字节，
        # 后端特意给了 private, max-age=600 + ETag，好让「切走再切回」走浏览器磁盘缓存。
        # nginx 的 add_header 是**追加**不是覆盖，一刀切加 no-store 会让浏览器同时收到
        # 两条 Cache-Control，no-store 生效，资料缓存直接作废——正是要修的那个毛病。
        # 私有 JSON 的 no-store 由后端 NoStoreJSONMiddleware 按 content-type 精确下发。
    }

    # ---------------------------------------------------------------
    # 5b) 视频播放（P2-5：稳定路径 + query 签名，边缘鉴权）
    #
    #   地址形状与 B 站 / 腾讯视频一致：
    #     /v/{video_id}/{相对路径}?e={过期}&u={用户}&s={签名}
    #   路径 /v/{id}/{rel} 与对象键 video-{id}/{rel}（桶 videos-play）一一对应，
    #   所以 nginx 不查库就能直连 MinIO。签发在 app/video_sign.py。
    #
    #   ⚠️ 前置条件（不满足就是把整个视频库敞开，务必逐条确认）：
    #   1. nginx 必须编译了 ngx_http_secure_link_module。查：
    #        nginx -V 2>&1 | tr ' ' '\n' | grep secure_link
    #      官方源和 Debian/Ubuntu 的 nginx-full 都自带；没有就换包或退回 5c 的兜底。
    #   2. videos-play 桶要开匿名读（nginx 不做 S3 SigV4 签名）：
    #        mc anonymous set download myminio/videos-play
    #      **因此 MinIO 的端口绝对不能对公网可达**——公网入口只能是这台 nginx。
    #   3. 资料模块的预签名 URL（materials 桶）是浏览器直连 MinIO 的，所以生产上
    #      MINIO_PUBLIC_ENDPOINT 必须指向 nginx 上一个**只放行 materials 桶**的
    #      server，而不是 MinIO 本体。否则第 2 条一开，videos-play 直接裸奔。
    #      （见文件末尾 5d 那个独立的 server 块。）
    # ---------------------------------------------------------------

    # 5b-①：播放列表回源到应用。
    # HLS 的 URI 是相对解析的，**query 不会被继承**：master 上的签名传不到子列表和切片。
    # 所以 .m3u8 必须由应用逐条改写补签名（routers/video_play._rewrite_playlist）。
    # 一次播放只有两三个 m3u8、每个几十 KB，回源代价可以忽略；真正的几百 MB 是切片，
    # 那些走下面 5b-② 完全不进应用。
    location ~ ^/v/\d+/.+\.m3u8$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # 5b-②：切片在边缘校验后直连 MinIO，字节不进 FastAPI。
    location ~ ^/v/(\d+)/(.+)$ {
        # 待签串必须与 app/video_sign._digest 逐字符一致："{e}{uri}{u} {secret}"。
        # $secure_link_expires 就是 $arg_e；$uri 是解码规范化后的路径，不含 query。
        # ⚠️ 把 CHANGE_ME 换成 .env 里的 MINIO_PLAY_SECRET（两边必须同一个值）。
        secure_link     $arg_s,$arg_e;
        secure_link_md5 "$secure_link_expires$uri$arg_u CHANGE_ME_MINIO_PLAY_SECRET";

        # $secure_link：""=签名不对（含缺参），"0"=签名对但已过期，"1"=放行。
        if ($secure_link = "") { return 403; }
        if ($secure_link = "0") { return 410; }

        # /v/12/720p/seg_00001.ts → /videos-play/video-12/720p/seg_00001.ts
        # 结尾那个 ? 是**故意的**：丢掉原始 query。签名参数已经在上面校验完了，
        # 带着 e/u/s 去请求对象存储没有任何意义，只会污染 MinIO 的访问日志，
        # 也让 proxy_cache_key 之外的地方多一层「同内容不同键」的隐患。
        rewrite ^/v/(\d+)/(.+)$ /videos-play/video-$1/$2? break;
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        # Host 用上游地址：MinIO 按 Host 做 bucket 解析（path-style 下无所谓，
        # 但传业务域名会让 MinIO 的访问日志难看，且将来切 virtual-host style 会炸）。
        proxy_set_header Host 127.0.0.1:9000;
        proxy_set_header Authorization "";   # 别把浏览器的凭据透给对象存储
        proxy_buffering off;                 # 边下边发，首帧更快

        # 切片是**不可变内容**（转码产物生成后不会再变），而且同一用户在同一时间片内
        # 拿到的 URL 逐字节相同（video_sign 的 deadline 量化）——两者叠加，F5 之后
        # 浏览器磁盘缓存直接命中，切片不再重下。这正是 P2-5 要的效果。
        # private：URL 是按 uid 签的，不能进任何共享缓存。
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, max-age=86400, immutable" always;

        # 可选：边缘共享缓存。URL 带 uid 各不相同，但**内容与 uid 无关**，
        # 所以缓存键只取 $uri（这就是 B 站那类 CDN「缓存键忽略签名参数」的做法），
        # 不同学生看同一节课在 nginx 这层就命中，回源 MinIO 的流量骤降。
        # ⚠️ 启用时必须把上面的 proxy_buffering off 去掉——nginx 要先缓冲才能落盘，
        #    buffering 关着 proxy_cache 就是个静默失效的摆设（首帧会快一点点，
        #    但换来的是每片都回源，得不偿失）。
        # 启用前需在 http {} 里声明：
        #   proxy_cache_path /var/cache/nginx/video levels=1:2 keys_zone=video:100m
        #                    max_size=50g inactive=7d use_temp_path=off;
        # proxy_cache       video;
        # proxy_cache_key   $uri;
        # proxy_cache_valid 200 206 7d;
        # proxy_cache_lock  on;
    }

    # 5c) 兜底：没有 secure_link 模块时，把 /v/ 整段交回应用（= 改造前的行为）。
    #     应用内同样校验签名（video_play.stream），功能等价，只是字节要过一遍 uvicorn。
    #     启用时请注释掉上面 5b-②。
    # location /v/ {
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_buffering off;
    #     proxy_no_cache 1;
    #     proxy_cache_bypass 1;
    # }

    # ---------------------------------------------------------------
    # 6) Scratch 工作台：独立 webpack 子应用，挂在同源 /scratch-studio/
    #
    #    **必须写在 SPA fallback 之前**（前缀 location 比 location / 优先），
    #    否则下面那条 try_files 会把 /scratch-studio/ 回成 index.html →
    #    SPA 路由匹配不到 → 撞上 router/index.js 末尾的
    #    `{path: "/:pathMatch(.*)*", redirect: "/"}` → **学生点「打开编程工作台」
    #    直接跳回首页**。dev 侧的同一个坑由 vite.config.js 的 /scratch-studio 代理挡住。
    #
    #    构建产物来自 前端程序/scratch-studio 的 `npm run build`（输出 dist/）。
    #    webpack 那边 `publicPath: 'auto'`，chunks/static 按脚本实际位置解析，
    #    所以挂在子路径下不需要改构建配置。
    #
    #    缓存按 /admin/ 那一条的口径：整体 no-cache（回源验证，ETag 命中 304）。
    #    这里刻意不给 immutable——Studio 的 dist 是混合的：入口 `studio.<hash>.js`
    #    带 hash，但 scratch-gui 拷过来的 `extension-worker.js`、`*.hex` 是固定名，
    #    一条正则分不干净，分错的代价是升级 GUI 后浏览器永远用旧 worker。
    #    真要长缓存，请只针对 `studio\.[0-9a-f]+\.js` 单开一条，别按扩展名一刀切。
    # ---------------------------------------------------------------
    location /scratch-studio/ {
        alias /var/www/scratch-studio/dist/;
        try_files $uri $uri/ /scratch-studio/index.html;
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------
    # 6b) 打字两个子应用：/typing-studio/（旧 Vue 版，字母乐园等少儿玩法）
    #     与 /typing-studio-qwerty/（qwerty-learner fork，主力打字模块）
    #
    #     同样**必须写在 SPA fallback 之前**，理由与 6) 一字不差：漏掉这两条，
    #     工具箱里点「字母乐园」「打字星球」就会被 try_files 回成 index.html →
    #     撞上兜底路由 → **跳回首页**。
    #
    #     与 scratch 的区别：这两个是 Vite 子应用，没有 webpack 的 publicPath:'auto'，
    #     资源路径由构建时的 base 决定。两边的 vite.config 已把 base 设成下面这两个
    #     挂载路径（**不是** './'），dev 代理与生产 location 因此完全对齐。
    #     改挂载路径时，nginx 与对应 vite.config 的 base 必须一起改。
    #
    #     构建产物：typing-studio → `npm run build` 出 dist/；
    #               typing-studio-qwerty → `npm run build` 出 dist/（vite.config outDir 已统一为 dist）。
    # ---------------------------------------------------------------
    location /typing-studio/ {
        alias /var/www/typing-studio/dist/;
        try_files $uri $uri/ /typing-studio/index.html;
        add_header Cache-Control "no-cache";
    }

    location /typing-studio-qwerty/ {
        alias /var/www/typing-studio-qwerty/dist/;
        try_files $uri $uri/ /typing-studio-qwerty/index.html;
        add_header Cache-Control "no-cache";
    }

    # 数学星球 Vue 子应用。独立部署并保留 SPA 深链回退。
    location /math-studio/ {
        alias /var/www/math-studio/dist/;
        try_files $uri $uri/ /math-studio/index.html;
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------
    # 6c) 专注星球：FocusTide fork，Nuxt 静态产出，挂在同源 /focus-studio/
    #
    #     同样**必须写在 SPA fallback 之前**，理由与 6) 一字不差。
    #     与 typing 的区别：Nuxt 用 app.baseURL='/focus-studio/' 生成**绝对**资源
    #     路径，nginx 这里必须原样 alias 到 dist/ 根（dist 根 = /focus-studio/ 命名空间），
    #     不要再套一层 dist/focus-studio/ 子目录。
    #
    #     构建产物：前端程序/focus-studio 的 `nuxi generate`，
    #     输出 dist/（nuxt.config nitro.output.publicDir 已统一，**不是** .output/public）。
    #     本机构建注意：node 进程默认带 NODE_OPTIONS fs shim，直接跑会报
    #     [safe-delete] 错误，用 `NODE_OPTIONS= node node_modules/nuxt/bin/nuxt.mjs generate`。
    #
    #     Service Worker：workbox 运行时缓存 + 导航兜底，scope 锁定在 /focus-studio/
    #     （pwa 模块把 SW 放到 dist 根 + app.vue 注册时显式 scope，见开发文档 26 §4.5）。
    #     SW 文件必须禁止缓存，否则版本更新推不下去。
    # ---------------------------------------------------------------
    location = /focus-studio/serviceworker.js {
        alias /var/www/focus-studio/dist/serviceworker.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /focus-studio/ {
        alias /var/www/focus-studio/dist/;
        try_files $uri $uri/ /focus-studio/index.html;
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------
    # 7) SPA fallback：非文件、非 /api /v /media /scratch-studio /typing-studio* /math-studio /focus-studio* 的路径回 index.html
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏后端版本信息
    server_tokens off;
}

# ---------------------------------------------------------------
# 5d) 浏览器直连对象存储的**唯一**入口：只放行 materials 桶。
#
# 为什么必须单独一个 server、且 Host 与路径原样透传：资料走的是 S3v4 预签名 URL，
# 而 S3v4 把 **Host 和 path 都签进了签名**。只要 nginx 改了其中任何一个
# （比如挂在 /s3/ 前缀下再 rewrite 掉，或把 Host 改写成 127.0.0.1:9000），
# MinIO 用收到的值重算签名就对不上，一律 403。所以：
#   - MINIO_PUBLIC_ENDPOINT = https://minio.study.example.com（就是本 server 的域名）
#   - MinIO 启动时设 MINIO_SERVER_URL 为同一个域名
#   - proxy_set_header Host $host，路径不做任何 rewrite
#
# 有了这个入口，MinIO 本体就可以只监听内网/回环，videos-play 桶的匿名读
# （5b-② 的前置条件 2）才不会从公网被直接摸到。
# ---------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name minio.study.example.com;

    # ssl_certificate     /etc/nginx/ssl/minio.study.example.com.pem;
    # ssl_certificate_key /etc/nginx/ssl/minio.study.example.com.key;

    client_max_body_size 0;   # 分片上传直传，不限制体积

    location /materials/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;          # 见上：改了就 403
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                  # 大文件边下边发
    }

    # 其余桶（含 videos-play）一律不对外：它是匿名可读的，只允许经 /v/ 的
    # secure_link 校验后由 nginx 内部取。
    location / {
        return 404;
    }

    server_tokens off;
}
